    // --- Web Audio API Synthesizer ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      getAudioContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }
      playFocusCompleteSound(volume = 0.8) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0, now + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.3 * volume, now + idx * 0.12 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 2.0);
        });
      }
      playBreakCompleteSound(volume = 0.8) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const notes = [440, 554.37, 659.25];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.15);
          gain.gain.setValueAtTime(0, now + idx * 0.15);
          gain.gain.linearRampToValueAtTime(0.25 * volume, now + idx * 0.15 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.15 + 1.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.15);
          osc.stop(now + idx * 0.15 + 1.7);
        });

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);

        const now = ctx.currentTime;

        const gain = ctx.createGain();
        osc.type = 'sine';

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

    const getStored = (key, fallback) => {

    // --- Multi-Account & Cloud Sync Engine (Cross-Device Global Access) ---
    const normalizeEmail = (email) => {
      if (!email || typeof email !== 'string') return '';

    };

    // 100% Deterministic Pure JavaScript SHA-256 implementation
    const sha256Pure = (ascii) => {
      if (!ascii) return '';
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }

      const k = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,

        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,

        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];

      let hash = [
        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
      ];

      const utf8 = unescape(encodeURIComponent(ascii));
      const utf8BitLength = utf8.length * 8;
      const words = [];

      for (let i = 0; i < utf8.length; i++) {
        words[i >> 2] |= (utf8.charCodeAt(i) & 0xff) << ((3 - (i % 4)) * 8);
      }

      words[utf8BitLength >> 5] |= 0x80 << (24 - (utf8BitLength % 32));
      words[(((utf8BitLength + 64) >> 9) << 4) + 15] = utf8BitLength;

      const w = new Array(64);

      for (let i = 0; i < words.length; i += 16) {
        let a = hash[0];
        let b = hash[1];
        let c = hash[2];
        let d = hash[3];
        let e = hash[4];
        let f = hash[5];
        let g = hash[6];
        let h = hash[7];

        for (let j = 0; j < 64; j++) {
          if (j < 16) {
            w[j] = words[i + j] | 0;
          } else {
            const gamma0 = rightRotate(w[j - 15], 7) ^ rightRotate(w[j - 15], 18) ^ (w[j - 15] >>> 3);
            const gamma1 = rightRotate(w[j - 2], 17) ^ rightRotate(w[j - 2], 19) ^ (w[j - 2] >>> 10);
            w[j] = (w[j - 16] + gamma0 + w[j - 7] + gamma1) | 0;
          }

          const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
          const ch = (e & f) ^ (~e & g);
          const temp1 = (h + s1 + ch + k[j] + w[j]) | 0;
          const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (s0 + maj) | 0;

          h = g;
          g = f;
          f = e;
          e = (d + temp1) | 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) | 0;
        }

        hash[0] = (hash[0] + a) | 0;
        hash[1] = (hash[1] + b) | 0;
        hash[2] = (hash[2] + c) | 0;
        hash[3] = (hash[3] + d) | 0;
        hash[4] = (hash[4] + e) | 0;
        hash[5] = (hash[5] + f) | 0;
        hash[6] = (hash[6] + g) | 0;
        hash[7] = (hash[7] + h) | 0;
      }

      let result = '';
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j >= 0; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    };

    const legacyFallbackHash = (text) => {
      if (!text) return '';
      let h1 = 0xdeadbeef ^ text.length;
      let h2 = 0x41c6ce57 ^ text.length;
      for (let i = 0; i < text.length; i++) {
        const ch = text.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16) + 'abc12345';
    };

    const hashPassword = async (password, salt = 'focusflow_secure_salt_2026') => {
      if (!password) return '';
      const text = `${salt}:${password.trim()}:${salt}`;
      if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
        try {
          const msgBuffer = new TextEncoder().encode(text);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (_) {}
      }
      return sha256Pure(text);
    };

    const getCloudTopics = (emailOrKey) => {
      let cleanEmail = '';
      let hash = '';
      let directTopic = '';
      let directAuthTopic = '';
      if (emailOrKey && typeof emailOrKey === 'string') {

          directTopic = `ff_em_${safe}`;
          directAuthTopic = `ff_ema_${safe}`;

        directTopic: directTopic || `ff_em_${hash}`,
        directAuthTopic: directAuthTopic || `ff_ema_${hash}`,
        hash,
      };
    };

    const getUserCloudKey = async (email) => {
      const clean = normalizeEmail(email);
      const hash = sha256Pure(`user_cloud_ns:${clean}`);
      return `ff_u_${hash.slice(0, 24)}`;
    };

    const getLegacyUserCloudKey = (email) => {
      const clean = normalizeEmail(email);
      const text = `user_id_salt:${clean}:user_id_salt`;
      const leg = legacyFallbackHash(text);
      return `ff_user_${leg.slice(0, 24)}`;
    };

    const verifyPasswordRecord = async (enteredPassword, userRecord) => {
      if (!enteredPassword || !userRecord) return false;
      if (!userRecord.password && !userRecord.passwordHash) return false;

      const enteredPlain = enteredPassword.trim();
      if (!enteredPlain) return false;
      const enteredHash = await hashPassword(enteredPlain);
      const text = `focusflow_secure_salt_2026:${enteredPlain}:focusflow_secure_salt_2026`;
      const enteredLegacyHash = legacyFallbackHash(text);

      if (userRecord.password && userRecord.password.trim() === enteredPlain) return true;
      if (userRecord.passwordHash && userRecord.passwordHash === enteredHash) return true;
      if (userRecord.password && userRecord.password.trim()) {
        const storedHashed = await hashPassword(userRecord.password.trim());
        if (storedHashed === enteredHash) return true;
        if (userRecord.password.trim() === enteredHash) return true;
      }
      if (userRecord.passwordHash && userRecord.passwordHash === enteredLegacyHash) return true;

      return false;
    };

    let broadcastChan = null;
    try {
      if (typeof window !== 'undefined' && window.BroadcastChannel) {
        broadcastChan = new BroadcastChannel('focusflow_global_sync_channel');
      }
    } catch (_) {}

    const getUserStorageKey = (email, dataType) => {
      const cleanEmail = normalizeEmail(email) || 'guest';
      const safeEmail = cleanEmail.replace(/[^a-z0-9@._-]/g, '_');
      return `focusflow_u_${safeEmail}_${dataType}_v2`;
    };

    // Auto-purge all previous accounts to ensure completely clean slate as requested
    const autoPurgeHistoricalAccounts = () => {
      if (typeof window === 'undefined' || !window.localStorage) return;
      try {
        const PURGE_FLAG = 'focusflow_auto_purged_v3_clean';
        if (!localStorage.getItem(PURGE_FLAG)) {
          localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
          localStorage.removeItem(STORAGE_KEYS.USERS);

          const legacyKeys = [
            'focusflow_registered_users_v2',
            'focusflow_registered_users_v1',
            'focusflow_users_v1',
            'focusflow_users',
            'focusflow_current_user_v2',
            'focusflow_current_user_v1',
            'focusflow_current_user',
            'focusflow_user_profile_v1',
            'focusflow_google_user_v1',
            'focusflow_cloud_cached_users_v2',
            'focusflow_cloud_cached_users_v1',
            'focusflow_last_cloud_sync_time_v1',
            'focusflow_cloud_last_sync_v2'
          ];
          legacyKeys.forEach(k => {
            try { localStorage.removeItem(k); } catch (_) {}
          });

          const keysInStorage = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k) keysInStorage.push(k);
          }
          keysInStorage.forEach(k => {
            if (
              k.startsWith('focusflow_u_') ||
              k.startsWith('cloud_cache_') ||
              k.startsWith('focusflow_google_')
            ) {
              try { localStorage.removeItem(k); } catch (_) {}
            }
          });

          localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify([]));
          localStorage.setItem(PURGE_FLAG, 'true');
        }
      } catch (_) {}
    };

    // Execute purge immediately upon load
    autoPurgeHistoricalAccounts();

    // Clean registered users reader
    const getRegisteredUsers = () => {
      const users = getStored(STORAGE_KEYS.USERS, []);
      if (!Array.isArray(users)) return [];
      return users.filter(u => u && u.email && u.email.includes('@'));
    };

    const saveRegisteredUsers = (users) => {
      setStored(STORAGE_KEYS.USERS, users);
    };

    const findUserByEmail = (email) => {
      const clean = normalizeEmail(email);
      if (!clean) return null;
      return getRegisteredUsers().find(u => normalizeEmail(u.email) === clean) || null;
    };

    const getCurrentUser = () => {
      const user = getStored(STORAGE_KEYS.CURRENT_USER, null);
      if (user && user.email) user.email = normalizeEmail(user.email);
      return user;
    };

    const setCurrentUser = (user) => {
      if (!user) {
        localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
      } else {
        const clean = { ...user, email: normalizeEmail(user.email) };
        setStored(STORAGE_KEYS.CURRENT_USER, clean);
      }
    };

    const getUserData = (email, dataType, fallback) => {
      const key = getUserStorageKey(email, dataType);
      return getStored(key, fallback);
    };

    const setUserData = (email, dataType, value) => {
      const key = getUserStorageKey(email, dataType);
      setStored(key, value);
    };

    const deleteUserAccount = (email) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail) return false;
      const users = getRegisteredUsers().filter(u => normalizeEmail(u.email) !== cleanEmail);
      saveRegisteredUsers(users);
      const cur = getCurrentUser();
      if (cur && normalizeEmail(cur.email) === cleanEmail) {
        setCurrentUser(null);
      }
      try {
        localStorage.removeItem(getUserStorageKey(cleanEmail, 'tasks'));
        localStorage.removeItem(getUserStorageKey(cleanEmail, 'events'));
        localStorage.removeItem(getUserStorageKey(cleanEmail, 'pomo_sessions'));
        localStorage.removeItem(getUserStorageKey(cleanEmail, 'settings'));
      } catch (_) {}
      return true;
    };

    const clearAllRegisteredAccounts = () => {
      try {
        localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
        localStorage.removeItem(STORAGE_KEYS.USERS);
        const keysToRemove = [
          'focusflow_registered_users_v2',
          'focusflow_registered_users_v1',
          'focusflow_users_v1',
          'focusflow_users',
          'focusflow_current_user_v2',
          'focusflow_current_user_v1',
          'focusflow_current_user',
          'focusflow_user_profile_v1',
          'focusflow_google_user_v1',
          'focusflow_cloud_cached_users_v2',
          'focusflow_cloud_cached_users_v1',
          'focusflow_last_cloud_sync_time_v1',
          'focusflow_cloud_last_sync_v2'
        ];
        keysToRemove.forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });

        const keysInStorage = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) keysInStorage.push(k);
        }
        keysInStorage.forEach(k => {
          if (k.startsWith('focusflow_u_') || k.startsWith('cloud_cache_') || k.startsWith('focusflow_google_')) {
            try { localStorage.removeItem(k); } catch (_) {}
          }
        });
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify([]));
        return true;
      } catch (err) {
        return false;
      }
    };

    const saveToCloudRemote = async (key, data) => {
      if (!data) return false;
      const cleanEmail = normalizeEmail(data.email || (key && key.includes('@') ? key : ''));
      const topics = getCloudTopics(cleanEmail || key);
      const payload = JSON.stringify(data);

      // 1. Local Cache
      try {
        localStorage.setItem(`cloud_cache_${key}`, payload);
        localStorage.setItem(`cloud_cache_${topics.mainTopic}`, payload);
        if (topics.directTopic) {
          localStorage.setItem(`cloud_cache_${topics.directTopic}`, payload);
        }
      } catch (e) {}

      // 2. Local User Catalog
      if (cleanEmail) {
        const users = getRegisteredUsers();
        const existingIdx = users.findIndex(u => normalizeEmail(u.email) === cleanEmail);
        const summary = {
          id: data.id || `usr-${Date.now()}`,
          email: cleanEmail,
          name: data.name || cleanEmail.split('@')[0],
          password: data.password || '',
          passwordHash: data.passwordHash || '',
          passwordUpdatedAt: data.passwordUpdatedAt || data.updatedAt || new Date().toISOString(),
          avatar: data.avatar || null,
          createdAt: data.createdAt || new Date().toISOString(),
          lastLogin: new Date().toISOString(),
          updatedAt: data.updatedAt || new Date().toISOString(),
        };
        if (existingIdx >= 0) users[existingIdx] = { ...users[existingIdx], ...summary };
        else users.push(summary);
        saveRegisteredUsers(users);
      }

      // 3. Broadcast to all open tabs / windows on this device
      try {
        if (broadcastChan) {
          broadcastChan.postMessage({ type: 'CLOUD_UPDATE', key, data });
        }
      } catch (_) {}

      // 4. Background Global Cloud Relay Push (Non-blocking for instant UI response)
      try {
        const authData = {
          type: 'AUTH_RECORD',
          id: data.id,
          email: cleanEmail,
          name: data.name,
          password: data.password || '',
          passwordHash: data.passwordHash || '',
          passwordUpdatedAt: data.passwordUpdatedAt || data.updatedAt || new Date().toISOString(),
          avatar: data.avatar || null,
          updatedAt: data.updatedAt || new Date().toISOString(),
        };

        const pushToNtfy = async (topic, bodyStr, title) => {
          if (!topic) return;
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);
            await fetch(`https://ntfy.sh/${topic}`, {
              method: 'POST',
              body: bodyStr,
              headers: {
                'Title': title,
                'Priority': 'urgent',
              },
              signal: controller.signal,
            });
            clearTimeout(timeoutId);
          } catch (_) {}
        };

        const pushTasks = [
          pushToNtfy(topics.directAuthTopic, JSON.stringify(authData), 'FocusFlow Auth Record Direct'),
          pushToNtfy(topics.authTopic, JSON.stringify(authData), 'FocusFlow Auth Record'),
          pushToNtfy(topics.directTopic, payload, 'FocusFlow Direct Sync'),
          pushToNtfy(topics.mainTopic, payload, 'FocusFlow Cloud Sync'),
        ];

        if (data.data) {
          const dataPayload = {
            type: 'DATA_RECORD',
            email: cleanEmail,
            updatedAt: data.updatedAt || new Date().toISOString(),
            data: data.data,
          };
          pushTasks.push(pushToNtfy(topics.dataTopic, JSON.stringify(dataPayload), 'FocusFlow User Data'));
        }

        if (topics.legacyTopic && topics.legacyTopic !== topics.mainTopic) {
          pushTasks.push(pushToNtfy(topics.legacyTopic, payload, 'FocusFlow Cloud Sync'));
        }

        Promise.allSettled(pushTasks).catch(() => {});
      } catch (cloudErr) {
        console.warn('Real cloud push warning:', cloudErr);
      }

      return true;
    };

    const loadFromCloudRemote = async (key, email = null) => {
      let cloudRecord = null;
      const cleanEmail = normalizeEmail(email || (key && key.includes('@') ? key : ''));
      const topics = getCloudTopics(cleanEmail || key);

      const fetchTopicDoc = async (topicName, timeoutMs = 7000) => {
        if (!topicName) return null;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
          const urls = [
            `https://ntfy.sh/${topicName}/json?poll=1&since=all&t=${Date.now()}`,
            `https://ntfy.sh/${topicName}/json?poll=1&t=${Date.now()}`,
          ];

          let res = null;
          try {
            res = await fetch(urls[0], {
              signal: controller.signal,
              cache: 'no-cache',
            });
          } catch (e) {
            if (e.name !== 'AbortError') {
              try {
                res = await fetch(urls[1], {
                  signal: controller.signal,
                  cache: 'no-cache',
                });
              } catch (_) {}
            }
          }
          clearTimeout(timeoutId);

          if (res && res.ok) {
            const text = await res.text();
            if (text && text.trim()) {
              const lines = text.trim().split('\n').filter(Boolean);
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const item = JSON.parse(lines[i]);
                  if (item && item.message) {
                    try {
                      const parsedDoc = JSON.parse(item.message);
                      if (parsedDoc && typeof parsedDoc === 'object') {
                        return parsedDoc;
                      }
                    } catch (_) {}
                  }
                  if (item && item.attachment && item.attachment.url) {
                    try {
                      const fileController = new AbortController();
                      const fileTimeout = setTimeout(() => fileController.abort(), 6000);
                      const fileRes = await fetch(item.attachment.url, {
                        signal: fileController.signal,
                        cache: 'no-cache',
                      });
                      clearTimeout(fileTimeout);
                      if (fileRes && fileRes.ok) {
                        const doc = await fileRes.json();
                        if (doc && typeof doc === 'object') {
                          return doc;
                        }
                      }
                    } catch (_) {}
                  }
                } catch (_) {}
              }
            }
          }
        } catch (err) {}
        return null;
      };

      try {
        const fetchPromises = [
          fetchTopicDoc(topics.directAuthTopic, 7000),
          fetchTopicDoc(topics.authTopic, 7000),
          fetchTopicDoc(topics.directTopic, 7000),
          fetchTopicDoc(topics.dataTopic, 7000),
          fetchTopicDoc(topics.mainTopic, 7000),
        ];

        if (topics.legacyTopic && topics.legacyTopic !== topics.mainTopic) {
          fetchPromises.push(fetchTopicDoc(topics.legacyTopic, 7000));
        }

        if (cleanEmail) {
          const legKey = getLegacyUserCloudKey(cleanEmail);
          if (legKey && legKey !== topics.mainTopic && legKey !== topics.legacyTopic) {
            fetchPromises.push(fetchTopicDoc(legKey, 7000));
          }
        }

        const results = await Promise.allSettled(fetchPromises);
        const docs = results.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);

        let merged = {};
        for (const doc of docs) {
          if (!doc || typeof doc !== 'object') continue;
          merged = {
            ...merged,
            ...doc,
          };
          if (doc.data) {
            merged.data = doc.data;
          }
          if (doc.password || doc.passwordHash) {
            merged.password = doc.password || merged.password || '';
            merged.passwordHash = doc.passwordHash || merged.passwordHash || '';
            merged.passwordUpdatedAt = doc.passwordUpdatedAt || merged.passwordUpdatedAt;
          }
        }

        if (merged.email || merged.password || merged.passwordHash || merged.data) {
          cloudRecord = merged;
        }
      } catch (err) {
        console.warn('Parallel cloud fetch warning:', err);
      }

      if (cloudRecord) {
        try {
          const jsonStr = JSON.stringify(cloudRecord);
          localStorage.setItem(`cloud_cache_${key}`, jsonStr);
          localStorage.setItem(`cloud_cache_${topics.mainTopic}`, jsonStr);
          if (topics.directTopic) {
            localStorage.setItem(`cloud_cache_${topics.directTopic}`, jsonStr);
          }
          if (cloudRecord.email) {
            const uEmail = normalizeEmail(cloudRecord.email);
            const users = getRegisteredUsers();
            const existingIdx = users.findIndex(u => normalizeEmail(u.email) === uEmail);
            const summary = {
              id: cloudRecord.id || `usr-${Date.now()}`,
              email: uEmail,
              name: cloudRecord.name || uEmail.split('@')[0],
              password: cloudRecord.password || '',
              passwordHash: cloudRecord.passwordHash || '',
              passwordUpdatedAt: cloudRecord.passwordUpdatedAt || cloudRecord.updatedAt || new Date().toISOString(),
              avatar: cloudRecord.avatar || null,
              createdAt: cloudRecord.createdAt || new Date().toISOString(),
              lastLogin: cloudRecord.lastLogin || new Date().toISOString(),
              updatedAt: cloudRecord.updatedAt || new Date().toISOString(),
            };
            if (existingIdx >= 0) {
              users[existingIdx] = { ...users[existingIdx], ...summary };
            } else {
              users.push(summary);
            }
            saveRegisteredUsers(users);
          }
        } catch (_) {}
        return cloudRecord;
      }

      try {
        const cached = localStorage.getItem(`cloud_cache_${key}`) ||
          localStorage.getItem(`cloud_cache_${topics.mainTopic}`) ||
          (topics.directTopic ? localStorage.getItem(`cloud_cache_${topics.directTopic}`) : null);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed) return parsed;
        }
        if (cleanEmail) {
          const legKey = getLegacyUserCloudKey(cleanEmail);
          const legCached = localStorage.getItem(`cloud_cache_${legKey}`);
          if (legCached) {
            const parsed = JSON.parse(legCached);
            if (parsed) return parsed;
          }
        }
      } catch (_) {}

      return null;
    };

    const subscribeToCloudEvents = (key, onUpdate) => {
      if (typeof window === 'undefined' || !window.EventSource || !key) return () => {};
      try {
        const topics = getCloudTopics(key);
        const eventSources = [];

        const handleMessage = (e) => {
          try {
            const msgObj = JSON.parse(e.data);
            if (msgObj) {
              if (msgObj.message) {
                try {
                  const doc = JSON.parse(msgObj.message);
                  if (doc && (doc.email || doc.data || doc.password || doc.passwordHash)) {
                    onUpdate(doc);
                    return;
                  }
                } catch (_) {}
              }
              if (msgObj.attachment && msgObj.attachment.url) {
                fetch(msgObj.attachment.url).then(r => r.json()).then(doc => {
                  if (doc && (doc.email || doc.data)) {
                    onUpdate(doc);
                  }
                }).catch(() => {});
              }
            }
          } catch (_) {}
        };

        const esData = new EventSource(`https://ntfy.sh/${topics.dataTopic}/sse`);
        esData.onmessage = handleMessage;
        eventSources.push(esData);

        const esMain = new EventSource(`https://ntfy.sh/${topics.mainTopic}/sse`);
        esMain.onmessage = handleMessage;
        eventSources.push(esMain);

        return () => {
          eventSources.forEach(es => {
            try { es.close(); } catch (_) {}
          });
        };
      } catch (e) {
        return () => {};
      }
    };

    const registerCloudAccount = async ({ email, password, name, initialData = null }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail || !cleanEmail.includes('@')) {
        return { ok: false, message: 'Địa chỉ Gmail không hợp lệ! Vui lòng kiểm tra lại.' };
      }
      if (!password || password.trim().length < 4) {
        return { ok: false, message: 'Mật khẩu phải có ít nhất 4 ký tự!' };
      }

      const cloudKey = await getUserCloudKey(cleanEmail);
      const passwordHash = await hashPassword(password);
      const enteredPlain = password.trim();

      const existingLocal = findUserByEmail(cleanEmail);
      let cachedCloud = null;
      try {
        const raw = localStorage.getItem(`cloud_cache_${cloudKey}`);
        if (raw) cachedCloud = JSON.parse(raw);
      } catch (_) {}

      const existing = (existingLocal && (existingLocal.password || existingLocal.passwordHash) ? existingLocal : null) ||
        (cachedCloud && (cachedCloud.password || cachedCloud.passwordHash) ? cachedCloud : null);

      if (existing && (existing.password || existing.passwordHash)) {
        const isMatch = await verifyPasswordRecord(enteredPlain, existing);
        if (isMatch) {
          return loginCloudAccount({ email: cleanEmail, password: enteredPlain });
        }

        return {
          ok: false,
          errorType: 'EMAIL_EXISTS',
          message: `Tài khoản Gmail "${cleanEmail}" đã được tạo mật khẩu trước đó trên hệ thống! Vui lòng chuyển sang tab "Đăng Nhập" để nhập đúng mật khẩu hoặc chọn "Đặt lại mật khẩu".`
        };
      }

      const displayName = name && name.trim()
        ? name.trim()
        : (existing?.name || cleanEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()));

      const defaultDataset = initialData || {
        tasks: DEFAULT_TASKS,
        events: DEFAULT_EVENTS,
        pomoSessions: generateInitialPomoSessions(),
        settings: DEFAULT_SETTINGS,
      };

      const newUserRecord = {
        id: existing?.id || `usr-${Date.now()}`,
        email: cleanEmail,
        name: displayName,
        password: enteredPlain,
        passwordHash: passwordHash,
        passwordUpdatedAt: new Date().toISOString(),
        avatar: existing?.avatar || null,
        createdAt: existing?.createdAt || new Date().toISOString(),
        lastLogin: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        data: defaultDataset,
      };

      // Non-blocking cloud push
      saveToCloudRemote(cloudKey, newUserRecord).catch(() => {});
      const legacyKey = getLegacyUserCloudKey(cleanEmail);
      if (legacyKey && legacyKey !== cloudKey) {
        saveToCloudRemote(legacyKey, newUserRecord).catch(() => {});
      }

      const sessionUser = {
        id: newUserRecord.id,
        email: newUserRecord.email,
        name: newUserRecord.name,
        avatar: newUserRecord.avatar,
        createdAt: newUserRecord.createdAt,
        passwordHash: passwordHash,
      };

      setCurrentUser(sessionUser);
      setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());

      setUserData(cleanEmail, 'tasks', defaultDataset.tasks);
      setUserData(cleanEmail, 'events', defaultDataset.events);
      setUserData(cleanEmail, 'pomo_sessions', defaultDataset.pomoSessions);
      setUserData(cleanEmail, 'settings', defaultDataset.settings);

      return { 
        ok: true, 
        user: sessionUser, 
        data: newUserRecord.data,
        message: `Đăng ký thành công! Mật khẩu cho Gmail "${cleanEmail}" đã được kích hoạt đồng bộ trên cả máy tính & điện thoại.` 
      };
    };

    const loginCloudAccount = async ({ email, password }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail) return { ok: false, message: 'Vui lòng nhập địa chỉ Gmail!' };
      if (!password || !password.trim()) return { ok: false, message: 'Vui lòng nhập mật khẩu tài khoản!' };

      const cloudKey = await getUserCloudKey(cleanEmail);
      const enteredPlain = password.trim();
      const enteredHash = await hashPassword(enteredPlain);

      // 1. FAST PATH (Instant 0.01s): Check local database or local cloud cache FIRST
      const registeredUsers = getRegisteredUsers();
      const localUser = registeredUsers.find(u => normalizeEmail(u.email) === cleanEmail && (u.password || u.passwordHash));
      let cachedCloud = null;
      try {
        const raw = localStorage.getItem(`cloud_cache_${cloudKey}`);
        if (raw) cachedCloud = JSON.parse(raw);
      } catch (_) {}

      const fastLocalCandidate = localUser || (cachedCloud && (cachedCloud.password || cachedCloud.passwordHash) ? cachedCloud : null);

      if (fastLocalCandidate) {
        const isFastMatch = await verifyPasswordRecord(enteredPlain, fastLocalCandidate);
        if (isFastMatch) {
          const sessionUser = {
            id: fastLocalCandidate.id || `usr-${Date.now()}`,
            email: cleanEmail,
            name: fastLocalCandidate.name || cleanEmail.split('@')[0],
            avatar: fastLocalCandidate.avatar || null,
            createdAt: fastLocalCandidate.createdAt || new Date().toISOString(),
            passwordHash: enteredHash,
          };

          setCurrentUser(sessionUser);
          setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());

          const dataset = fastLocalCandidate.data || {
            tasks: getUserData(cleanEmail, 'tasks', getStored(STORAGE_KEYS.TASKS, DEFAULT_TASKS)),
            events: getUserData(cleanEmail, 'events', DEFAULT_EVENTS),
            pomoSessions: getUserData(cleanEmail, 'pomo_sessions', generateInitialPomoSessions()),
            settings: getUserData(cleanEmail, 'settings', DEFAULT_SETTINGS),
          };

          setUserData(cleanEmail, 'tasks', dataset.tasks);
          setUserData(cleanEmail, 'events', dataset.events);
          setUserData(cleanEmail, 'pomo_sessions', dataset.pomoSessions);
          setUserData(cleanEmail, 'settings', dataset.settings);

          // Background cloud sync
          saveToCloudRemote(cloudKey, {
            ...fastLocalCandidate,
            email: cleanEmail,
            password: enteredPlain,
            passwordHash: enteredHash,
            lastLogin: new Date().toISOString(),
            data: dataset,
          }).catch(() => {});

          return {
            ok: true,
            user: sessionUser,
            data: dataset,
            message: `Đăng nhập thành công! Đã tải dữ liệu của tài khoản "${cleanEmail}".`,
          };
        }
      }

      // 2. REMOTE CLOUD PATH: Fast parallel query across remote topics (for phone / new device)
      let userRecord = null;
      try {
        userRecord = await loadFromCloudRemote(cloudKey, cleanEmail);
      } catch (err) {
        console.warn('Cloud login fetch error:', err);
      }

      if (!userRecord || (!userRecord.password && !userRecord.passwordHash)) {
        if (fastLocalCandidate) {
          userRecord = fastLocalCandidate;
        }
      }

      if (!userRecord || (!userRecord.password && !userRecord.passwordHash)) {

          ok: false,

          message: `Tài khoản Gmail "${cleanEmail}" chưa được đăng ký mật khẩu trên hệ thống. Vui lòng chuyển sang tab "Đăng Ký Mới" để tạo mật khẩu!`

      if (!isMatch) {
        return {
          ok: false,

          message: 'Mật khẩu không chính xác! Mỗi tài khoản Gmail chỉ có DUY NHẤT 1 mật khẩu cho cả máy tính và điện thoại. Nếu bạn đã đổi mật khẩu, vui lòng nhập mật khẩu mới nhất hoặc chọn "Đặt lại mật khẩu" bên dưới.'
        };

      userRecord.lastLogin = new Date().toISOString();
      userRecord.password = enteredPlain;
      userRecord.passwordHash = enteredHash;
      saveToCloudRemote(cloudKey, userRecord).catch(() => {});

      const sessionUser = {
        id: userRecord.id || `usr-${Date.now()}`,
        email: userRecord.email || cleanEmail,
        name: userRecord.name || cleanEmail.split('@')[0],
        avatar: userRecord.avatar || null,
        createdAt: userRecord.createdAt || new Date().toISOString(),
        passwordHash: enteredHash,
      };

      setCurrentUser(sessionUser);
      setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());

      const dataset = userRecord.data || {
        tasks: getUserData(cleanEmail, 'tasks', DEFAULT_TASKS),
        events: getUserData(cleanEmail, 'events', DEFAULT_EVENTS),
        pomoSessions: getUserData(cleanEmail, 'pomo_sessions', generateInitialPomoSessions()),
        settings: getUserData(cleanEmail, 'settings', DEFAULT_SETTINGS),
      };

      setUserData(cleanEmail, 'tasks', dataset.tasks);
      setUserData(cleanEmail, 'events', dataset.events);
      setUserData(cleanEmail, 'pomo_sessions', dataset.pomoSessions);
      setUserData(cleanEmail, 'settings', dataset.settings);

      return {
        ok: true,
        user: sessionUser,

        message: `Đăng nhập thành công! Đã tải dữ liệu của tài khoản "${cleanEmail}".`

    const resetCloudAccountPassword = async ({ email, newPassword }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail || !cleanEmail.includes('@')) {
        return { ok: false, message: 'Địa chỉ Gmail không hợp lệ!' };
      }
      if (!newPassword || newPassword.trim().length < 4) {
        return { ok: false, message: 'Mật khẩu mới phải có ít nhất 4 ký tự!' };
      }

      const cloudKey = await getUserCloudKey(cleanEmail);
      const enteredPlain = newPassword.trim();
      const newHash = await hashPassword(enteredPlain);

      let userRecord = null;
      try {
        userRecord = await loadFromCloudRemote(cloudKey, cleanEmail);
      } catch (_) {}

      const registeredUsers = getRegisteredUsers();
      const localUser = registeredUsers.find(u => normalizeEmail(u.email) === cleanEmail);

      const existingData = userRecord?.data || {
        tasks: getUserData(cleanEmail, 'tasks', DEFAULT_TASKS),
        events: getUserData(cleanEmail, 'events', DEFAULT_EVENTS),
        pomoSessions: getUserData(cleanEmail, 'pomo_sessions', generateInitialPomoSessions()),
        settings: getUserData(cleanEmail, 'settings', DEFAULT_SETTINGS),
      };

      const updatedRecord = {
        ...(userRecord || localUser || {}),
        id: userRecord?.id || localUser?.id || `usr-${Date.now()}`,
        email: cleanEmail,
        name: userRecord?.name || localUser?.name || cleanEmail.split('@')[0],
        password: enteredPlain,
        passwordHash: newHash,
        passwordUpdatedAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        lastLogin: new Date().toISOString(),
        data: existingData,
      };

      await saveToCloudRemote(cloudKey, updatedRecord);
      const legacyKey = getLegacyUserCloudKey(cleanEmail);
      if (legacyKey && legacyKey !== cloudKey) {
        await saveToCloudRemote(legacyKey, updatedRecord);
      }

      const users = getRegisteredUsers().map(u => normalizeEmail(u.email) === cleanEmail ? { ...u, password: enteredPlain, passwordHash: newHash } : u);
      saveRegisteredUsers(users);

      const sessionUser = {
        id: updatedRecord.id,
        email: updatedRecord.email,
        name: updatedRecord.name,
        avatar: updatedRecord.avatar || null,
        createdAt: updatedRecord.createdAt,
        passwordHash: newHash,
      };

      setCurrentUser(sessionUser);
      setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());

      return {
        ok: true,
        user: sessionUser,
        data: updatedRecord.data,
        message: `Đã cập nhật mật khẩu mới cho tài khoản "${cleanEmail}" thành công! Từ bây giờ, tất cả thiết bị (máy tính, điện thoại) đều phải đăng nhập bằng mật khẩu mới này.`
      };
    };

    const changeCloudPassword = async ({ email, oldPassword, newPassword }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail) return { ok: false, message: 'Chưa xác định tài khoản!' };

      const cloudKey = await getUserCloudKey(cleanEmail);
      let userRecord = null;
      try {
        userRecord = await loadFromCloudRemote(cloudKey, cleanEmail);
      } catch (_) {}

      if (!userRecord) {
        const localUser = findUserByEmail(cleanEmail);
        if (localUser && (localUser.password || localUser.passwordHash)) {
          userRecord = localUser;
        }
      }

      if (!userRecord) {
        return { ok: false, message: 'Không tìm thấy thông tin tài khoản trên hệ thống!' };
      }

      const isOldValid = await verifyPasswordRecord(oldPassword, userRecord);
      if (!isOldValid) {
        return { ok: false, message: 'Mật khẩu hiện tại không chính xác! Vui lòng kiểm tra lại.' };
      }

      if (!newPassword || newPassword.trim().length < 4) {
        return { ok: false, message: 'Mật khẩu mới phải có ít nhất 4 ký tự!' };
      }

      return resetCloudAccountPassword({ email: cleanEmail, newPassword });
    };

    const pushUserDataToCloud = async (user, dataPayload) => {
      if (!user || !user.email) return false;
      const cleanEmail = normalizeEmail(user.email);
      const cloudKey = await getUserCloudKey(cleanEmail);

      try {
        let userRecord = await loadFromCloudRemote(cloudKey);
        if (!userRecord) {
          userRecord = {
            id: user.id || `usr-${Date.now()}`,
            email: cleanEmail,
            name: user.name || cleanEmail.split('@')[0],
            password: user.password || '',
            passwordHash: user.passwordHash || '',
            createdAt: user.createdAt || new Date().toISOString(),
          };
        }

        userRecord.updatedAt = new Date().toISOString();
        userRecord.data = {
          tasks: dataPayload.tasks || [],
          events: dataPayload.events || [],
          pomoSessions: dataPayload.pomoSessions || [],
          settings: dataPayload.settings || DEFAULT_SETTINGS,
        };

        await saveToCloudRemote(cloudKey, userRecord);
        setUserData(cleanEmail, 'tasks', userRecord.data.tasks);
        setUserData(cleanEmail, 'events', userRecord.data.events);
        setUserData(cleanEmail, 'pomo_sessions', userRecord.data.pomoSessions);
        setUserData(cleanEmail, 'settings', userRecord.data.settings);

        setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());
        return true;
      } catch (err) {
        return false;
      }
    };

    const pullUserDataFromCloud = async (user) => {
      if (!user || !user.email) return null;
      const cleanEmail = normalizeEmail(user.email);
      const cloudKey = await getUserCloudKey(cleanEmail);

      try {
        const userRecord = await loadFromCloudRemote(cloudKey);
        if (userRecord && userRecord.data) {
          setStored('focusflow_last_cloud_sync_time_v1', new Date().toISOString());
          return userRecord.data;
        }
      } catch (err) {}

      return {
        tasks: getUserData(cleanEmail, 'tasks', DEFAULT_TASKS),
        events: getUserData(cleanEmail, 'events', DEFAULT_EVENTS),
        pomoSessions: getUserData(cleanEmail, 'pomo_sessions', generateInitialPomoSessions()),
        settings: getUserData(cleanEmail, 'settings', DEFAULT_SETTINGS),
      };
    };

    const generateQuickSyncToken = (user, data = null) => {
      if (!user || !user.email) return '';
      const tokenData = {
        u: normalizeEmail(user.email),
        n: user.name || '',
        h: user.passwordHash || '',
        p: user.password || '',
        t: Date.now(),
        d: data ? {
          tasks: data.tasks || [],
          events: data.events || [],
          pomoSessions: data.pomoSessions || [],
          settings: data.settings || null,
        } : null,
      };
      try {
        return btoa(unescape(encodeURIComponent(JSON.stringify(tokenData))));
      } catch (e) {
        return '';
      }
    };

    const generatePhoneLoginLink = (user, data = null) => {
      const token = generateQuickSyncToken(user, data);
      if (!token) return '';
      let baseUrl = '';
      if (typeof window !== 'undefined') {
        const isLocal = 
          window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1' || 
          window.location.protocol === 'file:';
          
        if (isLocal) {
          baseUrl = 'https://phong09829.github.io/Work-schedule/';
        } else {
          baseUrl = window.location.href.split('#')[0];
        }
      } else {
        baseUrl = 'https://phong09829.github.io/Work-schedule/';
      }
      return `${baseUrl}#sync=${token}`;
    };

    const parseQuickSyncToken = (tokenStr) => {
      try {
        if (!tokenStr) return null;
        const cleanToken = tokenStr.trim().replace(/^#(auth|login|sync|data)=/, '');
        const jsonStr = decodeURIComponent(escape(atob(cleanToken)));
        const parsed = JSON.parse(jsonStr);
        if (parsed && parsed.u) {
          return {
            email: normalizeEmail(parsed.u),
            name: parsed.n || parsed.u.split('@')[0],
            password: parsed.p || '',
            passwordHash: parsed.h || '',
            data: parsed.d || null,
          };
        }
      } catch (e) {}
      return null;
    };

    const deleteCloudAccount = async (email) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail) return false;
      const topics = getCloudTopics(cleanEmail);
      const tombstone = {
        type: 'DELETED',
        email: cleanEmail,
        deletedAt: new Date().toISOString(),
        data: null,
        password: '',
        passwordHash: '',
      };
      try {
        const payload = JSON.stringify(tombstone);
        fetch(`https://ntfy.sh/${topics.authTopic}`, { method: 'POST', body: payload, headers: { 'Title': 'FocusFlow Account Deleted', 'Priority': 'urgent' } }).catch(() => {});
        fetch(`https://ntfy.sh/${topics.dataTopic}`, { method: 'POST', body: payload, headers: { 'Title': 'FocusFlow Data Cleared', 'Priority': 'urgent' } }).catch(() => {});
        fetch(`https://ntfy.sh/${topics.mainTopic}`, { method: 'POST', body: payload, headers: { 'Title': 'FocusFlow Wiped', 'Priority': 'urgent' } }).catch(() => {});
        if (topics.legacyTopic && topics.legacyTopic !== topics.mainTopic) {
          fetch(`https://ntfy.sh/${topics.legacyTopic}`, { method: 'POST', body: payload }).catch(() => {});
        }
      } catch (_) {}
      deleteUserAccount(cleanEmail);
      try {
        localStorage.removeItem(`cloud_cache_${topics.mainTopic}`);
        localStorage.removeItem(`cloud_cache_${topics.legacyTopic}`);
      } catch (_) {}
      return true;
    };

    const clearAllCloudAccounts = async () => {
      const users = getRegisteredUsers();
      for (const u of users) {
        if (u.email) {
          await deleteCloudAccount(u.email);
        }
      }
      clearAllRegisteredAccounts();
      return true;
    };

    const formatForDateTimeInput = (date) => {
      if (!date) return '';
      const d = typeof date === 'string' ? new Date(date) : date;
      if (isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    // --- Google Calendar API Helpers ---
    const fetchGoogleUserProfile = async (accessToken) => {
      const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) throw new Error('User info failed');
      return await res.json();
    };

    const fetchGoogleCalendarEventsAPI = async (accessToken) => {
      const minDate = new Date(Date.now() - 30 * 86400000).toISOString();
      const maxDate = new Date(Date.now() + 90 * 86400000).toISOString();
      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(minDate)}&timeMax=${encodeURIComponent(maxDate)}&singleEvents=true&orderBy=startTime&maxResults=250`;
      
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) {
        if (res.status === 401) throw new Error('TOKEN_EXPIRED');
        throw new Error('Google Calendar fetch failed');
      }
      const data = await res.json();
      return (data.items || []).map(item => {
        const isAllDay = Boolean(item.start?.date && !item.start?.dateTime);
        const start = isAllDay ? item.start.date : item.start.dateTime || item.start.date;
        const end = isAllDay ? item.end.date : item.end.dateTime || item.end.date;
        let meetUrl = item.hangoutLink || '';

        return {
          id: `gcal-${item.id}`,
          googleEventId: item.id,
          title: item.summary || '(Không có tiêu đề)',
          description: item.description || '',
          start: start,
          end: end,
          allDay: isAllDay,
          category: 'Công việc',
          color: '#3b82f6',
          location: item.location || '',
          meetUrl: meetUrl,
          isGoogleEvent: true,
          synced: true,
        };
      });
    };

    const createGoogleCalendarEventAPI = async (accessToken, event) => {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh';
      const body = {
        summary: event.title,
        description: event.description || '',
        location: event.location || '',
      };
      if (event.allDay) {
        body.start = { date: event.start.slice(0, 10) };
        body.end = { date: (event.end || event.start).slice(0, 10) };
      } else {
        body.start = { dateTime: new Date(event.start).toISOString(), timeZone };
        body.end = { dateTime: new Date(event.end || event.start).toISOString(), timeZone };
      }
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Failed to create on Google');
      return await res.json();
    };

    const updateGoogleCalendarEventAPI = async (accessToken, googleEventId, event) => {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh';
      const body = {
        summary: event.title,
        description: event.description || '',
        location: event.location || '',
      };
      if (event.allDay) {
        body.start = { date: event.start.slice(0, 10) };
        body.end = { date: (event.end || event.start).slice(0, 10) };
      } else {
        body.start = { dateTime: new Date(event.start).toISOString(), timeZone };
        body.end = { dateTime: new Date(event.end || event.start).toISOString(), timeZone };
      }
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(googleEventId)}`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Failed to update on Google');
      return await res.json();
    };

    const deleteGoogleCalendarEventAPI = async (accessToken, googleEventId) => {
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(googleEventId)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      return res.ok;
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isDark, setIsDark] = useState(() => getStored(STORAGE_KEYS.THEME, 'dark') === 'dark');
      
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) root.classList.add('dark');
        else root.classList.remove('dark');
        setStored(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      }, [isDark]);

      const [activeTab, setActiveTab] = useState('dashboard');

      const [currentUser, setCurrentUserState] = useState(() => getCurrentUser());

      const [tasks, setTasks] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'tasks', DEFAULT_TASKS);
        return getStored(STORAGE_KEYS.TASKS, DEFAULT_TASKS);
      });
      const [events, setEvents] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'events', DEFAULT_EVENTS);
        return getStored(STORAGE_KEYS.EVENTS, DEFAULT_EVENTS);
      });
      const [pomoSessions, setPomoSessions] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'pomo', generateInitialPomoSessions());
        return getStored(STORAGE_KEYS.POMO_SESSIONS, generateInitialPomoSessions());
      });
      const [settings, setSettings] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'settings', DEFAULT_SETTINGS);
        return getStored(STORAGE_KEYS.SETTINGS, DEFAULT_SETTINGS);
      });
      const [activeTaskId, setActiveTaskId] = useState(() => tasks.find(t => t.status === 'in_progress')?.id || tasks[0]?.id || null);
      
      const [cloudSyncStatus, setCloudSyncStatus] = useState('synced');
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);
      const [lastCloudSyncTime, setLastCloudSyncTime] = useState(() => getStored('focusflow_last_cloud_sync_time_v1', null));

      const [googleClientId, setGoogleClientId] = useState(() => getStored(STORAGE_KEYS.GOOGLE_CLIENT_ID, ''));
      const [googleUser, setGoogleUser] = useState(() => getStored(STORAGE_KEYS.GOOGLE_USER, null));
      const [googleToken, setGoogleToken] = useState(() => getStored(STORAGE_KEYS.GOOGLE_TOKEN, null));
      const [isGoogleSyncing, setIsGoogleSyncing] = useState(false);

      const isGoogleConnected = Boolean(googleUser);
      const isAccountLoggedIn = Boolean(currentUser && currentUser.email);

      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(current => current && current.id <= Date.now() - 3500 ? null : current), 3500);
      };

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [taskToEdit, setTaskToEdit] = useState(null);
      const [defaultStatusForNew, setDefaultStatusForNew] = useState('todo');
      const [isGoogleModalOpen, setIsGoogleModalOpen] = useState(false);

      // Cloud Auto-Sync Engine
      const cloudSyncTimerRef = useRef(null);

      const triggerCloudSync = useCallback((customData = null) => {
        if (!currentUser?.email) return;
        if (cloudSyncTimerRef.current) clearTimeout(cloudSyncTimerRef.current);
        setCloudSyncStatus('syncing');
        cloudSyncTimerRef.current = setTimeout(async () => {
          try {
            setIsCloudSyncing(true);
            const payload = customData || { tasks, events, pomoSessions, settings };
            const ok = await pushUserDataToCloud(currentUser, payload);
            if (ok) {
              setLastCloudSyncTime(new Date().toISOString());
              setCloudSyncStatus('synced');
            } else {
              setCloudSyncStatus('offline');
            }
          } catch (e) {
            setCloudSyncStatus('offline');
          } finally {
            setIsCloudSyncing(false);
          }
        }, 1200);
      }, [currentUser, tasks, events, pomoSessions, settings]);

      const syncWithCloud = useCallback(async (showNotification = false) => {
        if (!currentUser?.email) return;
        try {
          setIsCloudSyncing(true);
          setCloudSyncStatus('syncing');
          const cloudData = await pullUserDataFromCloud(currentUser);
          if (cloudData) {
            if (cloudData.tasks) { setTasks(cloudData.tasks); setUserData(currentUser.email, 'tasks', cloudData.tasks); }
            if (cloudData.events) { setEvents(cloudData.events); setUserData(currentUser.email, 'events', cloudData.events); }
            if (cloudData.pomoSessions) { setPomoSessions(cloudData.pomoSessions); setUserData(currentUser.email, 'pomo', cloudData.pomoSessions); }
            if (cloudData.settings) { setSettings(cloudData.settings); setUserData(currentUser.email, 'settings', cloudData.settings); }
            setLastCloudSyncTime(new Date().toISOString());
            setCloudSyncStatus('synced');
            if (showNotification) showToast('Đã đồng bộ dữ liệu mới nhất từ Đám Mây!', 'success');
          } else {
            await pushUserDataToCloud(currentUser, { tasks, events, pomoSessions, settings });
            setCloudSyncStatus('synced');
          }
        } catch (err) {
          setCloudSyncStatus('offline');
        } finally {
          setIsCloudSyncing(false);
        }
      }, [currentUser, tasks, events, pomoSessions, settings]);

      // Visibility & Online Sync
      useEffect(() => {
        if (!currentUser?.email) return;
        const handleVis = () => { if (document.visibilityState === 'visible') syncWithCloud(false); };
        const handleOnl = () => { showToast('Đã kết nối Internet! Đang đồng bộ...', 'info'); syncWithCloud(false); };
        window.addEventListener('visibilitychange', handleVis);
        window.addEventListener('online', handleOnl);
        syncWithCloud(false);
        const iv = setInterval(() => { if (document.visibilityState === 'visible') syncWithCloud(false); }, 45000);
        return () => {
          window.removeEventListener('visibilitychange', handleVis);
          window.removeEventListener('online', handleOnl);
          clearInterval(iv);
        };
      }, [currentUser?.email]);

      // Realtime Live Cloud Sync Subscription between Phone and PC (Instant 2-way reflection)
      useEffect(() => {
        if (!currentUser || !currentUser.email) return;

        let unsub = () => {};
        getUserCloudKey(currentUser.email).then(cloudKey => {
          unsub = subscribeToCloudEvents(cloudKey, (remoteDoc) => {
            if (remoteDoc && remoteDoc.data) {
              const d = remoteDoc.data;
              if (Array.isArray(d.tasks)) {
                setTasks(d.tasks);
                setUserData(currentUser.email, 'tasks', d.tasks);
              }
              if (Array.isArray(d.events)) {
                setEvents(d.events);
                setUserData(currentUser.email, 'events', d.events);
              }
              if (Array.isArray(d.pomoSessions)) {
                setPomoSessions(d.pomoSessions);
                setUserData(currentUser.email, 'pomo', d.pomoSessions);
              }
              if (d.settings) {
                setSettings(d.settings);
                setUserData(currentUser.email, 'settings', d.settings);
              }
              setLastCloudSyncTime(new Date().toISOString());
              setCloudSyncStatus('synced');
            }
          });
        });

        return () => {
          unsub();
        };
      }, [currentUser?.email]);

      // Persistence to LocalStorage & Cloud Trigger
      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'tasks', tasks);
        setStored(STORAGE_KEYS.TASKS, tasks);
        triggerCloudSync();
      }, [tasks, currentUser?.email]);

      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'events', events);
        setStored(STORAGE_KEYS.EVENTS, events);
        triggerCloudSync();
      }, [events, currentUser?.email]);

      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'pomo', pomoSessions);
        setStored(STORAGE_KEYS.POMO_SESSIONS, pomoSessions);
        triggerCloudSync();

      return (
        <div className="min-h-screen relative flex flex-col transition-colors duration-300">

                    ⏱️
                  </div>
                  <div>
                    <span className="text-lg font-extrabold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">

                    return (

          {isGoogleModalOpen && (

              onLogoutAccount={logoutAccount}

                setSettings(newSettings);
                setIsSettingsOpen(false);
                showToast('Đã lưu cài đặt hệ thống!', 'success');
              }}
              onExport={() => {
                const backup = { version: '2.0', exportDate: new Date().toISOString(), tasks, events, pomoSessions, settings };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `focusflow-backup-${todayStr}.json`;
                link.click();
                URL.revokeObjectURL(url);
                showToast('Đã xuất dữ liệu sao lưu thành công!', 'success');
              }}
              onImport={(data) => {
                if (data.tasks) setTasks(data.tasks);
                if (data.events) setEvents(data.events);
                if (data.pomoSessions) setPomoSessions(data.pomoSessions);
                if (data.settings) setSettings(data.settings);
                showToast('Đã khôi phục dữ liệu!', 'success');
              }}
              onReset={() => {
                setTasks(DEFAULT_TASKS);
                setEvents(DEFAULT_EVENTS);
                setPomoSessions(generateInitialPomoSessions());
                setSettings(DEFAULT_SETTINGS);
                showToast('Đã đặt lại dữ liệu mặc định!', 'info');
                setIsSettingsOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // --- 1. DASHBOARD VIEW STANDALONE ---
    function DashboardViewStandalone({
      todayFocusMinutes,
      todayCompletedTasks,
      totalCompletedTasks,
      todayPomoCount,
      streakDays,
      tasks,
      events,
      pomoSessions,
      settings,
      setActiveTab,
      linkTaskToPomodoro,
      moveTaskStatus,
      isDark
    }) {
      const hours = (todayFocusMinutes / 60).toFixed(1);
      const targetPomos = settings.dailyGoalPomos || 8;
      const goalProgress = Math.min(100, Math.round((todayPomoCount / targetPomos) * 100));

      const urgentTask = useMemo(() => {
        return (
          tasks.find(t => t.status === 'in_progress' && t.priority === 'high') ||
          tasks.find(t => t.status === 'in_progress') ||
          tasks.find(t => t.status === 'todo' && t.priority === 'high') ||
          tasks.find(t => t.status === 'todo') ||
          null
        );
      }, [tasks]);

      const recentTasks = useMemo(() => tasks.slice(0, 4), [tasks]);

      // Chart.js initialization
      const barCanvasRef = useRef(null);
      const doughnutCanvasRef = useRef(null);

      useEffect(() => {
        let barChart = null;
        let doughnutChart = null;

        if (barCanvasRef.current && window.Chart) {
          const days = [];
          const points = [];
          const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            const dayName = dayNames[d.getDay()];
            const totalMins = pomoSessions
              .filter(s => s.date === dateStr && s.type === 'focus')
              .reduce((sum, s) => sum + (s.durationMinutes || 0), 0);
            days.push(`${dayName} (${d.getDate()}/${d.getMonth() + 1})`);
            points.push(totalMins);
          }

          barChart = new window.Chart(barCanvasRef.current, {
            type: 'bar',
            data: {
              labels: days,
              datasets: [{
                label: 'Phút tập trung',
                data: points,
                backgroundColor: 'rgba(99, 102, 241, 0.85)',
                hoverBackgroundColor: 'rgba(79, 70, 229, 1)',
                borderRadius: 8,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' },
                  ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                },
                x: {
                  grid: { display: false },
                  ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                }
              }
            }
          });
        }

        if (doughnutCanvasRef.current && window.Chart) {
          const catMap = {};
          pomoSessions.forEach(s => {
            const cat = s.category || 'Công việc';
            catMap[cat] = (catMap[cat] || 0) + (s.durationMinutes || 25);
          });
          const labels = Object.keys(catMap).length ? Object.keys(catMap) : ['Công việc', 'Học tập', 'Cá nhân'];
          const dataValues = Object.keys(catMap).length ? Object.values(catMap) : [120, 90, 45];

          doughnutChart = new window.Chart(doughnutCanvasRef.current, {
            type: 'doughnut',
            data: {
              labels: labels,
              datasets: [{
                data: dataValues,
                backgroundColor: ['#6366f1', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'],
                borderWidth: 0,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: isDark ? '#94a3b8' : '#64748b', boxWidth: 12 } }
              },
              cutout: '70%'
            }
          });
        }

        return () => {
          if (barChart) barChart.destroy();
          if (doughnutChart) doughnutChart.destroy();
        };
      }, [pomoSessions, isDark]);

        <div className="space-y-8 animate-fade-in pb-12">

                  <span>Chào mừng bạn đến với FocusFlow</span>

                  Bạn đã hoàn thành <strong className="text-white font-bold">{todayPomoCount}</strong> phiên Pomodoro hôm nay. Tiếp tục duy trì chuỗi <strong className="text-amber-300 font-bold">{streakDays} ngày</strong> bứt phá nhé!
                </p>

                  onClick={() => setActiveTab('pomodoro')}

                >
                  <span>⏱️</span>
                  <span>Bật Pomodoro Ngay</span>
                </button>

                  onClick={() => setActiveTab('calendar')}

                  <span>Xem Lịch Trình</span>

              </div>
            </div>

              </div>
              <h3 className="text-2xl font-extrabold mt-2">{todayCompletedTasks}</h3>

            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Thời Gian Tập Trung</span>
                <span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-500 text-lg">🕒</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{hours}h</h3>
              <p className="text-xs text-slate-400 mt-1">{todayFocusMinutes} phút tập trung sâu</p>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Phiên Pomodoro</span>
                <span className="p-2 rounded-xl bg-purple-500/10 text-purple-500 text-lg">🍅</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{todayPomoCount}</h3>
              <p className="text-xs text-slate-400 mt-1">Mục tiêu: {targetPomos} phiên/ngày</p>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Chuỗi Kỷ Lục</span>
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-500 text-lg">🔥</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{streakDays} ngày</h3>
              <p className="text-xs text-amber-500 font-bold mt-1">Đang cháy!</p>

          </div>

          {/* Charts */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800">

              <div className="h-64">
                <canvas ref={barCanvasRef} />
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800">
              <h3 className="font-bold text-base mb-4">Phân Bổ Theo Danh Mục</h3>
              <div className="h-64">
                <canvas ref={doughnutCanvasRef} />
              </div>
            </div>
          </div>

          {/* Urgent Task & Recent List */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-rose-500 flex items-center gap-1.5 mb-2">
                  <span>⚡</span> Công việc cần tập trung
                </span>
                {urgentTask ? (
                  <div className="space-y-2">
                    <h3 className="font-bold text-lg">{urgentTask.title}</h3>
                    <p className="text-xs text-slate-400 line-clamp-2">{urgentTask.description || 'Chưa có mô tả.'}</p>
                    <div className="flex gap-2 text-xs pt-2">
                      <span className="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-500 font-bold">{urgentTask.category}</span>
                      <span className="text-slate-400">🍅 {urgentTask.completedPomos || 0}/{urgentTask.estimatedPomos || 1} Pomos</span>
                    </div>
                  </div>
                ) : (
                  <div className="py-6 text-center text-slate-400">
                    <p>Tuyệt vời! Đã hết việc cần làm.</p>
                  </div>
                )}

              {urgentTask && (
                <button
                  onClick={() => linkTaskToPomodoro(urgentTask)}

    // --- 3. POMODORO VIEW STANDALONE ---
    function PomodoroViewStandalone({ settings, activeTask, activeTaskId, setActiveTaskId, tasks, recordCompletedPomodoro, pomoSessions, todayFocusMinutes, todayPomoCount, showToast }) {
      const [mode, setMode] = useState('focus');
      const [isRunning, setIsRunning] = useState(false);
      const [cycleCount, setCycleCount] = useState(1);

      const getSeconds = (m) => {
        if (m === 'focus') return (settings.focusDuration || 25) * 60;
        if (m === 'shortBreak') return (settings.shortBreakDuration || 5) * 60;
        if (m === 'longBreak') return (settings.longBreakDuration || 15) * 60;
        return 25 * 60;
      };

      const [timeLeft, setTimeLeft] = useState(() => getSeconds('focus'));
      const [totalDuration, setTotalDuration] = useState(() => getSeconds('focus'));

      useEffect(() => {
        if (!isRunning) {
          const s = getSeconds(mode);
          setTimeLeft(s);
          setTotalDuration(s);
        }
      }, [settings, mode]);

      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (isRunning && timeLeft === 0) {
          setIsRunning(false);
          if (mode === 'focus') {
            if (settings.soundEnabled) soundManager.playFocusCompleteSound(settings.soundVolume);
            recordCompletedPomodoro('focus');
            const isLong = cycleCount >= (settings.longBreakInterval || 4);
            setCycleCount(prev => isLong ? 1 : prev + 1);
            setMode(isLong ? 'longBreak' : 'shortBreak');
            const nextSec = getSeconds(isLong ? 'longBreak' : 'shortBreak');
            setTimeLeft(nextSec);
            setTotalDuration(nextSec);
          } else {
            if (settings.soundEnabled) soundManager.playBreakCompleteSound(settings.soundVolume);
            setMode('focus');
            const nextSec = getSeconds('focus');
            setTimeLeft(nextSec);
            setTotalDuration(nextSec);
          }
        }
        return () => { if (interval) clearInterval(interval); };
      }, [isRunning, timeLeft]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const progress = totalDuration > 0 ? (totalDuration - timeLeft) / totalDuration : 0;
      const strokeDashoffset = 880 - 880 * progress;

      return (
        <div className="space-y-8 animate-fade-in max-w-3xl mx-auto pb-12">
          <div className="text-center space-y-2">
            <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">Đồng Hồ Pomodoro Thông Minh</h1>
            <p className="text-xs sm:text-sm text-slate-400">25 phút tập trung cao độ + 5 phút nghỉ ngơi duy trì trạng thái Deep Work.</p>
          </div>

          <div className="glass-card rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-2xl relative overflow-hidden flex flex-col items-center">
            <div className="flex gap-2 mb-6 bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">
              {[
                { id: 'focus', label: 'Tập Trung 🍅' },
                { id: 'shortBreak', label: 'Nghỉ Ngắn ☕' },
                { id: 'longBreak', label: 'Nghỉ Dài 🛋️' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => { setIsRunning(false); setMode(t.id); const sec = getSeconds(t.id); setTimeLeft(sec); setTotalDuration(sec); }}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                    mode === t.id ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-md' : 'text-slate-400'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* Circular Progress Timer */}
            <div className="relative w-72 h-72 flex items-center justify-center">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="140" stroke="currentColor" strokeWidth="12" fill="transparent" className="text-slate-200 dark:text-slate-800" />
                <circle
                  cx="150"
                  cy="150"
                  r="140"
                  stroke={mode === 'focus' ? '#6366f1' : '#10b981'}
                  strokeWidth="12"
                  strokeDasharray="880"
                  strokeDashoffset={strokeDashoffset}
                  strokeLinecap="round"
                  fill="transparent"
                  className="transition-all duration-1000 ease-linear"
                />
              </svg>

              <div className="absolute flex flex-col items-center justify-center text-center">
                <span className="font-mono text-5xl sm:text-6xl font-extrabold tracking-tight">
                  {formatTime(timeLeft)}
                </span>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400 mt-2">
                  {mode === 'focus' ? 'Phiên Tập Trung' : 'Giờ Nghỉ Ngơi'}
                </span>
                {activeTask && (
                  <span className="text-xs font-semibold text-indigo-500 mt-1 max-w-[180px] truncate">
                    🎯 {activeTask.title}
                  </span>
                )}
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-4 mt-8">
              <button
                onClick={() => { setIsRunning(false); setTimeLeft(getSeconds(mode)); }}
                className="px-4 py-2.5 rounded-2xl bg-slate-200 dark:bg-slate-800 text-xs font-bold hover:bg-slate-300 transition"
              >
                Đặt Lại
              </button>
              <button
                onClick={() => { soundManager.getAudioContext(); soundManager.playTapSound(); setIsRunning(!isRunning); }}
                className="px-8 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base shadow-xl shadow-indigo-500/30 active:scale-95 transition"
              >
                {isRunning ? 'TẠM DỪNG' : 'BẮT ĐẦU'}
              </button>
              <button
                onClick={() => setTimeLeft(0)}
                className="px-4 py-2.5 rounded-2xl bg-slate-200 dark:bg-slate-800 text-xs font-bold hover:bg-slate-300 transition"
              >
                Bỏ Qua
              </button>
            </div>

            <div className="mt-8 pt-4 border-t border-slate-200 dark:border-slate-800 w-full flex items-center justify-between text-xs text-slate-400">
              <span>Chu kỳ: {cycleCount}/{settings.longBreakInterval || 4}</span>
              <span>Hôm nay: {todayPomoCount} phiên ({todayFocusMinutes}p)</span>
            </div>
          </div>
        </div>
      );
    }

          const matchCat = selectedCategory === 'all' || e.category === selectedCategory;
          return matchQ && matchCat;

        const d = new Date(currentDate);
        if (viewMode === 'month') d.setMonth(d.getMonth() - 1);
        else if (viewMode === 'week') d.setDate(d.getDate() - 7);
        else if (viewMode === 'day') d.setDate(d.getDate() - 1);

        const d = new Date(currentDate);
        if (viewMode === 'month') d.setMonth(d.getMonth() + 1);
        else if (viewMode === 'week') d.setDate(d.getDate() + 7);
        else if (viewMode === 'day') d.setDate(d.getDate() + 1);
