              </div>
              <h3 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-slate-100">{headerTitle}</h3>
            </div>

            <div className="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-end">
              <input
                type="text"
                placeholder="Tìm sự kiện..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs w-36 sm:w-44 font-medium"
              />

              <select
                value={selectedCategory}
                onChange={e => setSelectedCategory(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold"
              >
                <option value="all">Tất cả danh mục</option>
                {EVENT_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>

              <div className="flex items-center p-1 rounded-xl bg-slate-200/80 dark:bg-slate-900/80 border border-slate-300/50 dark:border-slate-800">
                {[
                  { id: 'month', label: 'Tháng' },
                  { id: 'week', label: 'Tuần' },
                  { id: 'day', label: 'Ngày' },
                  { id: 'agenda', label: 'Lịch biểu' },
                ].map(mode => (
                  <button
                    key={mode.id}
                    onClick={() => setViewMode(mode.id)}
                    className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${
                      viewMode === mode.id ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-600 dark:text-slate-400'
                    }`}
                  >
                    {mode.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {viewMode === 'month' && (
            <MonthViewCalendar
              currentDate={currentDate}
              events={filteredEvents}
              onSelectEvent={(e) => { setEventToEdit(e); setIsEventModalOpen(true); }}
              onAddNew={(d) => { setEventToEdit(null); setSlotDate(d); setSlotHour(9); setIsEventModalOpen(true); }}
              onUpdateEvent={onUpdateEvent}
            />
          )}

          {viewMode === 'week' && (
            <WeekViewCalendar
              currentDate={currentDate}
              events={filteredEvents}
              onSelectEvent={(e) => { setEventToEdit(e); setIsEventModalOpen(true); }}
              onAddNew={(d, h) => { setEventToEdit(null); setSlotDate(d); setSlotHour(h); setIsEventModalOpen(true); }}
              onUpdateEvent={onUpdateEvent}
            />
          )}

          {viewMode === 'day' && (
            <DayViewCalendar
              currentDate={currentDate}
              events={filteredEvents}
              onSelectEvent={(e) => { setEventToEdit(e); setIsEventModalOpen(true); }}
              onAddNew={(d, h) => { setEventToEdit(null); setSlotDate(d); setSlotHour(h); setIsEventModalOpen(true); }}
              onLinkPomodoro={onLinkPomodoro}
            />
          )}

          {viewMode === 'agenda' && (
            <AgendaViewCalendar
              events={filteredEvents}
              onSelectEvent={(e) => { setEventToEdit(e); setIsEventModalOpen(true); }}
              onAddNew={() => { setEventToEdit(null); setSlotDate(new Date()); setIsEventModalOpen(true); }}
              onLinkPomodoro={onLinkPomodoro}
            />
          )}

          {isEventModalOpen && (
            <EventModalStandalone
              isOpen={isEventModalOpen}
              onClose={() => setIsEventModalOpen(false)}
              eventToEdit={eventToEdit}
              currentUser={currentUser}
              initialDate={slotDate}
              initialHour={slotHour}
              onSave={(evtData) => {
                if (eventToEdit) onUpdateEvent(eventToEdit.id, evtData);
                else onAddEvent(evtData);
                setIsEventModalOpen(false);
              }}
              onDelete={(id) => {
                onDeleteEvent(id);
                setIsEventModalOpen(false);
              }}
              onLinkPomodoro={(e) => {
                onLinkPomodoro(e);
                setIsEventModalOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // --- SUB-VIEW: MONTH ---
    function MonthViewCalendar({ currentDate, events, onSelectEvent, onAddNew, onUpdateEvent }) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let startDay = firstDay.getDay() - 1;
      if (startDay === -1) startDay = 6;

      const daysInMonth = lastDay.getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const prevDays = [];
      for (let i = startDay - 1; i >= 0; i--) {
        prevDays.push({ day: prevMonthLastDay - i, month: month - 1, year: month === 0 ? year - 1 : year, current: false });
      }

      const currDays = [];
      for (let i = 1; i <= daysInMonth; i++) {
        currDays.push({ day: i, month, year, current: true });
      }

      const nextDays = [];
      const remaining = 42 - (prevDays.length + currDays.length);
      for (let i = 1; i <= remaining; i++) {
        nextDays.push({ day: i, month: month + 1, year: month === 11 ? year + 1 : year, current: false });
      }

      const allDays = [...prevDays, ...currDays, ...nextDays];
      const today = new Date();
      const pad = n => String(n).padStart(2, '0');

      return (
        <div className="glass-card rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-xl">
          <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-100/50 dark:bg-slate-900/50 text-center text-xs font-bold py-3 text-slate-600 dark:text-slate-400">
            {['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'].map((h, i) => (
              <div key={i} className={i >= 5 ? 'text-indigo-500' : ''}>{h}</div>
            ))}
          </div>

          <div className="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-200/60 dark:divide-slate-800/60">
            {allDays.map((d, index) => {
              const actualMonth = d.month < 0 ? 12 + d.month : d.month % 12;
              const dateStr = `${d.year}-${pad(actualMonth + 1)}-${pad(d.day)}`;
              const dayEvts = events.filter(e => e.start && e.start.slice(0, 10) === dateStr);
              const isToday = d.day === today.getDate() && d.month === today.getMonth() && d.year === today.getFullYear();

              return (
                <div
                  key={index}
                  onClick={(e) => {
                    if (e.target === e.currentTarget || e.target.classList.contains('cell-click')) {
                      onAddNew(new Date(d.year, d.month, d.day));
                    }
                  }}
                  className={`min-h-[110px] p-2 transition-colors relative flex flex-col group cell-click ${
                    d.current ? 'bg-transparent hover:bg-slate-50/60 dark:hover:bg-slate-800/30' : 'bg-slate-100/30 dark:bg-slate-950/40 text-slate-400 dark:text-slate-600'
                  }`}
                >
                  <div className="flex items-center justify-between mb-1 cell-click">
                    <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold select-none ${
                      isToday ? 'bg-indigo-600 text-white shadow-md' : d.current ? 'text-slate-700 dark:text-slate-300' : 'text-slate-400'
                    }`}>
                      {d.day}
                    </span>
                    <button
                      onClick={(e) => { e.stopPropagation(); onAddNew(new Date(d.year, d.month, d.day)); }}
                      className="opacity-0 group-hover:opacity-100 w-5 h-5 rounded bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold"
                    >
                      +
                    </button>
                  </div>

                  <div className="flex-1 space-y-1 overflow-y-auto max-h-[75px] pr-0.5">
                    {dayEvts.map(evt => {
                      const timeStr = evt.allDay ? 'Cả ngày' : new Date(evt.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                      return (
                        <div
                          key={evt.id}
                          onClick={(e) => { e.stopPropagation(); onSelectEvent(evt); }}
                          className="px-2 py-1 rounded-lg text-[11px] font-semibold flex items-center justify-between gap-1 shadow-sm cursor-pointer hover:scale-[1.02] active:scale-98 transition truncate border"
                          style={{
                            backgroundColor: `${evt.color || '#3b82f6'}18`,
                            borderColor: `${evt.color || '#3b82f6'}40`,
                            color: evt.color || '#3b82f6',
                          }}
                        >
                          <span className="truncate">{evt.title}</span>
                          <span className="text-[9px] opacity-75">{timeStr}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- SUB-VIEW: WEEK ---
    function WeekViewCalendar({ currentDate, events, onSelectEvent, onAddNew, onUpdateEvent }) {
      const getMonday = (d) => {
        const date = new Date(d);
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(date.setDate(diff));
      };
      const monday = getMonday(currentDate);
      const weekDays = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });

      const hours = Array.from({ length: 24 }, (_, i) => i);
      const pad = n => String(n).padStart(2, '0');
      const today = new Date();
      const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();

      return (
        <div className="glass-card rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-xl flex flex-col h-[750px]">
          <div className="grid grid-cols-[60px_repeat(7,1fr)] border-b border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-900/70 select-none z-10">
            <div className="p-3 text-center text-xs font-bold text-slate-400">GMT+7</div>
            {weekDays.map((day, idx) => {
              const isToday = isSameDay(day, today);
              const names = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
              return (
                <div key={idx} className={`p-3 text-center border-r border-slate-200/60 dark:border-slate-800/60 ${isToday ? 'bg-indigo-500/10' : ''}`}>
                  <span className="text-xs text-slate-500">{names[idx]}</span>
                  <div className="mt-0.5">
                    <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-extrabold ${isToday ? 'bg-indigo-600 text-white shadow' : 'text-slate-800 dark:text-slate-200'}`}>
                      {day.getDate()}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex-1 overflow-y-auto relative">
            <div className="grid grid-cols-[60px_repeat(7,1fr)] relative min-w-[700px]">
              <div className="border-r border-slate-200/60 dark:border-slate-800/60 select-none bg-slate-50/50 dark:bg-slate-950/30">
                {hours.map(h => (
                  <div key={h} className="h-[60px] text-[11px] font-mono text-slate-400 text-right pr-2 pt-1 border-b border-slate-200/40 dark:border-slate-800/40">
                    {pad(h)}:00
                  </div>
                ))}
              </div>

              {weekDays.map((day, dayIdx) => {
                const dateStr = `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`;
                const dayEvts = events.filter(e => e.start && e.start.slice(0, 10) === dateStr);
                const isToday = isSameDay(day, today);

                return (
                  <div key={dayIdx} className={`relative border-r border-slate-200/60 dark:border-slate-800/60 ${isToday ? 'bg-indigo-500/[0.02]' : ''}`}>
                    {hours.map(h => (
                      <div
                        key={h}
                        onClick={() => onAddNew(day, h)}
                        className="h-[60px] border-b border-slate-200/40 dark:border-slate-800/40 hover:bg-indigo-500/5 transition cursor-pointer"
                      />
                    ))}

                    {dayEvts.map(evt => {
                      if (evt.allDay) return null;
                      const start = new Date(evt.start);
                      const end = new Date(evt.end || evt.start);
                      const startMins = start.getHours() * 60 + start.getMinutes();
                      const endMins = end.getHours() * 60 + end.getMinutes();
                      const topPx = (startMins / 60) * 60;
                      const heightPx = Math.max(((endMins - startMins) / 60) * 60, 26);

                      return (
                        <div
                          key={evt.id}
                          onClick={(e) => { e.stopPropagation(); onSelectEvent(evt); }}
                          className="absolute left-1 right-1 rounded-xl p-1.5 text-xs shadow-md border cursor-pointer hover:brightness-105 transition overflow-hidden z-10 font-medium"
                          style={{
                            top: `${topPx}px`,
                            height: `${heightPx}px`,
                            backgroundColor: `${evt.color || '#3b82f6'}22`,
                            borderColor: `${evt.color || '#3b82f6'}60`,
                            color: evt.color || '#3b82f6',
                          }}
                        >
                          <p className="font-bold truncate">{evt.title}</p>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- SUB-VIEW: DAY ---
    function DayViewCalendar({ currentDate, events, onSelectEvent, onAddNew, onLinkPomodoro }) {
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${currentDate.getFullYear()}-${pad(currentDate.getMonth() + 1)}-${pad(currentDate.getDate())}`;
      const dayEvts = events.filter(e => e.start && e.start.slice(0, 10) === dateStr);
      const hours = Array.from({ length: 24 }, (_, i) => i);

      return (
        <div className="glass-card rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-xl flex flex-col h-[750px]">
          <div className="flex-1 overflow-y-auto relative min-w-[480px]">
            {hours.map(h => (
              <div
                key={h}
                onClick={() => onAddNew(currentDate, h)}
                className="group h-[65px] border-b border-slate-200/40 dark:border-slate-800/40 flex items-start hover:bg-indigo-500/5 transition cursor-pointer"
              >
                <div className="w-16 text-right pr-3 pt-1 text-xs font-mono font-semibold text-slate-400">{pad(h)}:00</div>
                <div className="flex-1 h-full relative" />
              </div>
            ))}

            {dayEvts.map(evt => {
              const start = new Date(evt.start);
              const end = new Date(evt.end || evt.start);
              const startMins = start.getHours() * 60 + start.getMinutes();
              const endMins = end.getHours() * 60 + end.getMinutes();
              const topPx = (startMins / 60) * 65;
              const heightPx = Math.max(((endMins - startMins) / 60) * 65, 45);

              return (
                <div
                  key={evt.id}
                  onClick={(e) => { e.stopPropagation(); onSelectEvent(evt); }}
                  className="absolute left-16 right-4 rounded-2xl p-3 shadow-md border cursor-pointer hover:shadow-lg transition flex items-center justify-between z-10"
                  style={{
                    top: `${topPx}px`,
                    height: `${heightPx}px`,
                    backgroundColor: `${evt.color || '#3b82f6'}22`,
                    borderColor: `${evt.color || '#3b82f6'}60`,
                    color: evt.color || '#3b82f6',
                  }}
                >
                  <div>
                    <div className="font-bold text-sm">{evt.title}</div>
                    <div className="text-xs opacity-80 mt-0.5">{start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - {end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} • {evt.category}</div>
                  </div>
                  <button
                    onClick={(e) => { e.stopPropagation(); onLinkPomodoro(evt); }}
                    className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow"
                  >
                    ⏱️ Focus
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- SUB-VIEW: AGENDA ---
    function AgendaViewCalendar({ events, onSelectEvent, onAddNew, onLinkPomodoro }) {
      const sorted = [...events].sort((a, b) => new Date(a.start) - new Date(b.start));
      const grouped = {};
      sorted.forEach(e => {
        if (!e.start) return;
        const key = e.start.slice(0, 10);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(e);
      });
      const keys = Object.keys(grouped).sort();

      return (
        <div className="space-y-6">
          {keys.map(k => (
            <div key={k} className="space-y-3">
              <div className="flex items-center gap-3">
                <span className="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">
                  📅 {k}
                </span>
                <div className="flex-1 h-px bg-slate-200 dark:bg-slate-800" />
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {grouped[k].map(evt => (
                  <div
                    key={evt.id}
                    onClick={() => onSelectEvent(evt)}
                    className="glass-card rounded-2xl p-4 border border-slate-200 dark:border-slate-800 hover:shadow-lg transition cursor-pointer flex flex-col justify-between"
                    style={{ borderLeftWidth: '5px', borderLeftColor: evt.color || '#3b82f6' }}
                  >
                    <div>
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-sm">{evt.title}</h4>
                        <span className="text-xs px-2 py-0.5 rounded-full font-bold" style={{ backgroundColor: `${evt.color || '#3b82f6'}20`, color: evt.color || '#3b82f6' }}>
                          {evt.category}
                        </span>
                      </div>
                      {evt.description && <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{evt.description}</p>}
                    </div>

                    <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <span className="text-xs text-slate-500">
                        🕒 {new Date(evt.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </span>
                      <button
                        onClick={(e) => { e.stopPropagation(); onLinkPomodoro(evt); }}
                        className="px-3 py-1 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow"
                      >
                        ⏱️ Chạy Pomodoro
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // --- EVENT MODAL STANDALONE ---
    function EventModalStandalone({ isOpen, onClose, eventToEdit, currentUser, initialDate, initialHour = 9, onSave, onDelete, onLinkPomodoro }) {
      const [title, setTitle] = useState(eventToEdit?.title || '');
      const [description, setDescription] = useState(eventToEdit?.description || '');
      const [location, setLocation] = useState(eventToEdit?.location || '');
      const [category, setCategory] = useState(eventToEdit?.category || 'Công việc');
      const [color, setColor] = useState(eventToEdit?.color || '#3b82f6');
      const [allDay, setAllDay] = useState(Boolean(eventToEdit?.allDay));
      
      const baseDate = initialDate ? new Date(initialDate) : new Date();
      baseDate.setHours(initialHour, 0, 0, 0);
      const endDate = new Date(baseDate.getTime() + 3600000);

      const [startDateTime, setStartDateTime] = useState(formatForDateTimeInput(eventToEdit?.start || baseDate));
      const [endDateTime, setEndDateTime] = useState(formatForDateTimeInput(eventToEdit?.end || endDate));
      const [meetUrl, setMeetUrl] = useState(eventToEdit?.meetUrl || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onSave({
          title: title.trim(),
          description: description.trim(),
          location: location.trim(),
          category,
          color,
          allDay,
          start: new Date(startDateTime).toISOString(),
          end: new Date(endDateTime).toISOString(),
          meetUrl: meetUrl.trim(),
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-card w-full max-w-lg rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden flex flex-col max-h-[90vh]">
            <div className="h-2 w-full transition-colors duration-300" style={{ backgroundColor: color }} />
            
            <div className="p-5 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
              <div className="flex items-center gap-3">
                <div 
                  className="w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-md font-bold text-lg"
                  style={{ backgroundColor: color }}
                >
                  📅
                </div>
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900 dark:text-slate-100">
                    {eventToEdit ? 'Chỉnh Sửa Sự Kiện' : 'Thêm Lịch Trình Mới'}
                  </h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5 mt-0.5">
                    {currentUser?.email ? (
                      <span className="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400 font-semibold font-mono">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" /> Lưu vào tài khoản: {currentUser.email}
                      </span>
                    ) : (
                      <span>Lưu trữ nội bộ • Đăng nhập để lưu vào tài khoản Gmail</span>
                    )}
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-200">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 overflow-y-auto space-y-4 text-sm flex-1">
              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Tiêu đề sự kiện *</label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  placeholder="VD: Họp định kỳ, Học React, Đi công tác..."
                  className="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-xs text-slate-900 dark:text-slate-100"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Bắt đầu</label>
                  <input
                    type="datetime-local"
                    required
                    value={startDateTime}
                    onChange={e => setStartDateTime(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-slate-100"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Kết thúc</label>
                  <input
                    type="datetime-local"
                    required
                    value={endDateTime}

    // --- GOOGLE OAUTH & CLOUD ACCOUNT MODAL STANDALONE (OCEAN THEME) ---
    function GoogleOAuthModalStandalone({
      isOpen,
      onClose,
      currentUser,
      isAccountLoggedIn,
      onRegisterAccount,
      onLoginAccount,
      onResetPassword,

      onLogoutAccount,

      lastCloudSyncTime,
      onSyncCloud,
      quickSyncToken,
      phoneLoginLink,
      events = [],
      tasks = [],

      const [activeTab, setActiveTab] = useState(isAccountLoggedIn ? 'profile' : 'login');

      useEffect(() => {
        if (isOpen) {
          setActiveTab(isAccountLoggedIn ? 'profile' : 'login');

      // Login Form State
      const [loginEmail, setLoginEmail] = useState('');

      const [loginErrorState, setLoginErrorState] = useState(null);

      // Google Setup State
      const [inputClientId, setInputClientId] = useState(clientId || settings?.googleClientId || '');

      // Register Form State
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');
      const [showRegPassword, setShowRegPassword] = useState(false);

      // Reset Password Form State
      const [resetEmail, setResetEmail] = useState('');
      const [resetNewPassword, setResetNewPassword] = useState('');
      const [resetConfirmPassword, setResetConfirmPassword] = useState('');
      const [showResetPassword, setShowResetPassword] = useState(false);

      // Change Password Form State
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmNewPassword, setConfirmNewPassword] = useState('');
      const [showChangePassword, setShowChangePassword] = useState(false);

      if (!isOpen) return null;

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginErrorState(null);
        if (!loginEmail.trim()) {
          showToast('Vui lòng nhập địa chỉ Email!', 'warning');
          return;
        }
        if (!loginPassword) {
          showToast('Vui lòng nhập mật khẩu!', 'warning');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = onLoginAccount ? await onLoginAccount({
            email: loginEmail.trim(),
            password: loginPassword,
          }) : { ok: false };

          if (res && res.ok) {
            setActiveTab('profile');
            onClose();
          } else {
            setLoginErrorState(res || { message: 'Đăng nhập không thành công' });
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        if (!regEmail.trim() || !regEmail.includes('@')) {
          showToast('Vui lòng nhập địa chỉ Email hợp lệ!', 'warning');
          return;
        }
        if (!regPassword || regPassword.length < 4) {
          showToast('Mật khẩu phải có ít nhất 4 ký tự!', 'warning');
          return;
        }
        if (regPassword !== regConfirmPassword) {
          showToast('Mật khẩu xác nhận không khớp! Vui lòng nhập lại.', 'warning');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = onRegisterAccount ? await onRegisterAccount({
            email: regEmail.trim(),
            password: regPassword,
            name: regName.trim(),
          }) : { ok: false };

          if (res && res.ok) {
            setActiveTab('profile');
            onClose();
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleResetPasswordSubmit = async (e) => {
        e.preventDefault();
        if (!resetEmail.trim() || !resetEmail.includes('@')) {
          showToast('Vui lòng nhập địa chỉ Email hợp lệ!', 'warning');
          return;
        }
        if (!resetNewPassword || resetNewPassword.length < 4) {
          showToast('Mật khẩu mới phải có ít nhất 4 ký tự!', 'warning');
          return;
        }
        if (resetNewPassword !== resetConfirmPassword) {
          showToast('Xác nhận mật khẩu mới không khớp!', 'warning');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = onResetPassword ? await onResetPassword({
            email: resetEmail.trim(),
            newPassword: resetNewPassword,
          }) : { ok: false };

          if (res && res.ok) {
            setResetNewPassword('');
            setResetConfirmPassword('');
            setActiveTab('profile');
            onClose();
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      // Google Account Auth States (Gmail + Password)
      const [googleEmailInput, setGoogleEmailInput] = useState('phong09829@gmail.com');
      const [googlePasswordInput, setGooglePasswordInput] = useState('');
      const [showGooglePassword, setShowGooglePassword] = useState(false);
      const [isGoogleSubmitting, setIsGoogleSubmitting] = useState(false);
      const [googleLoginError, setGoogleLoginError] = useState(null);

      const handleOpenGoogleLoginTab = () => {
        setGoogleLoginError(null);
        if (loginEmail && loginEmail.includes('@')) {
          setGoogleEmailInput(loginEmail.trim());
        } else {
          setGoogleEmailInput('phong09829@gmail.com');
        }
        setActiveTab('google_login');
      };

      const handleGoogleGmailLoginSubmit = async (e) => {
        if (e) e.preventDefault();
        setGoogleLoginError(null);

        const targetEmail = (googleEmailInput || 'phong09829@gmail.com').trim();
        if (!targetEmail || !targetEmail.includes('@')) {
          showToast('Vui lòng nhập địa chỉ Gmail hợp lệ!', 'warning');
          return;
        }

        const password = googlePasswordInput ? googlePasswordInput.trim() : 'google123';
        setIsGoogleSubmitting(true);

        try {
          const cleanEmail = targetEmail.toLowerCase();
          const displayName = cleanEmail.split('@')[0];

          let res = onLoginAccount ? await onLoginAccount({ email: cleanEmail, password }) : { ok: false };
          
          if (!res.ok && (res.errorType === 'USER_NOT_FOUND' || res.message?.includes('chưa được đăng ký'))) {
            if (onRegisterAccount) {
              const regRes = await onRegisterAccount({
                email: cleanEmail,
                password,
                name: displayName,
              });
              if (regRes && regRes.ok) res = regRes;
            }
          }

          if (res && res.ok) {
            showToast(`🎉 Đăng nhập tài khoản Google "${cleanEmail}" thành công! Đang chuyển vào Schedule.`, 'success', 5000);
            onClose();
          } else {
            setGoogleLoginError(res);
          }
        } catch(err) {
          showToast('Có lỗi khi đăng nhập Google. Vui lòng thử lại!', 'error');
        } finally {
          setIsGoogleSubmitting(false);
        }
      };

      const handleQuickOneClickGoogleLogin = async () => {

        if (!targetEmail || !targetEmail.includes('@')) {
          showToast('Vui lòng nhập địa chỉ Gmail hợp lệ!', 'warning');
          return;
        }

        setIsGoogleSubmitting(true);
        try {
          const cleanEmail = targetEmail.toLowerCase();

          if (onRegisterAccount) {
            await onRegisterAccount({

              password: 'google_oauth_pass',

          onClose();

          showToast('Có lỗi khi đăng nhập. Vui lòng thử lại!', 'error');
        } finally {
          setIsGoogleSubmitting(false);
        }
      };

      const handleChangePasswordSubmit = async (e) => {
        e.preventDefault();
        if (!oldPassword) {
          showToast('Vui lòng nhập mật khẩu hiện tại!', 'warning');
          return;
        }
        if (!newPassword || newPassword.length < 4) {
          showToast('Mật khẩu mới phải có ít nhất 4 ký tự!', 'warning');
          return;
        }
        if (newPassword !== confirmNewPassword) {
          showToast('Xác nhận mật khẩu mới không khớp!', 'warning');
          return;
        }

        const res = onChangePassword ? await onChangePassword({
          oldPassword,
          newPassword,
        }) : { ok: false };

        if (res && res.ok) {
          setOldPassword('');
          setNewPassword('');
          setConfirmNewPassword('');
        }
      };

      const handleExportFullJSON = () => {
        const fullBackup = {
          version: '2.0',
          exportedAt: new Date().toISOString(),
          user: currentUser,
          tasks,
          events,
          pomoSessions,

        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });

        a.href = url;
        a.download = `focusflow-backup-${currentUser?.email?.split('@')[0] || 'data'}-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Đã xuất file sao lưu dữ liệu JSON an toàn!', 'success');
      };

      const formatTimeStr = (t) => {

        try {
          const d = new Date(t);
          return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString('vi-VN');

                  <form onSubmit={handleChangePasswordSubmit} className="space-y-3 p-3.5 rounded-2xl bg-[#131E34] border border-slate-700/70">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                        <span>🔒</span> Đổi mật khẩu tài khoản
                      </span>
                      <button
                        type="button"
                        onClick={() => setShowChangePassword(!showChangePassword)}
                        className="text-xs text-slate-400 hover:text-slate-200"
                      >
                        {showChangePassword ? '🙈 Ẩn' : '👁️ Hiện'}
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 mb-1">Mật khẩu cũ</label>
                        <input
                          type={showChangePassword ? 'text' : 'password'}
                          required
                          value={oldPassword}
                          onChange={(e) => setOldPassword(e.target.value)}
                          placeholder="Mật khẩu cũ"
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0B1528] border border-slate-700 text-xs font-semibold text-white focus:outline-none focus:border-cyan-400"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 mb-1">Mật khẩu mới</label>
                        <input
                          type={showChangePassword ? 'text' : 'password'}
                          required
                          minLength={4}
                          value={newPassword}
                          onChange={(e) => setNewPassword(e.target.value)}
                          placeholder="Tối thiểu 4 ký tự"
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0B1528] border border-slate-700 text-xs font-semibold text-white focus:outline-none focus:border-cyan-400"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 mb-1">Xác nhận</label>
                        <input
                          type={showChangePassword ? 'text' : 'password'}
                          required
                          value={confirmNewPassword}
                          onChange={(e) => setConfirmNewPassword(e.target.value)}
                          placeholder="Nhập lại mật khẩu"
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0B1528] border border-slate-700 text-xs font-semibold text-white focus:outline-none focus:border-cyan-400"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end pt-1">
                      <button
                        type="submit"
                        className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-xs shadow-md transition"
                      >
                        Cập Nhật Mật Khẩu
                      </button>
                    </div>
                  </form>
                </div>
              )}

            </div>

            {/* Modal Footer */}
            <div className="p-4 bg-slate-50 dark:bg-slate-900/60 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs">
              <span className="text-slate-400 font-medium truncate max-w-[200px] sm:max-w-[300px]">
                {currentUser ? `Tài khoản: ${currentUser.email}` : 'Chế độ lưu trữ đám mây'}
              </span>
              <button
                onClick={onClose}
                className="px-5 py-2 rounded-xl bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 text-xs font-bold shadow transition"
              >
                Đóng
              </button>
            </div>
          </div>
        </div>
      );
    }


    // --- TASK MODAL STANDALONE ---
    function TaskModalStandalone({ isOpen, onClose, taskToEdit, defaultStatus, onSave }) {
      const [formData, setFormData] = useState({
        title: taskToEdit?.title || '',
        description: taskToEdit?.description || '',
        category: taskToEdit?.category || 'Công việc',
        priority: taskToEdit?.priority || 'medium',
        status: taskToEdit?.status || defaultStatus || 'todo',
        deadline: taskToEdit?.deadline || '',
        estimatedPomos: taskToEdit?.estimatedPomos || 2,
        syncToCalendar: true,
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-card w-full max-w-lg rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-slate-800">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800 mb-4">
              <h2 className="text-lg font-bold">{taskToEdit ? 'Chỉnh Sửa Công Việc' : 'Tạo Công Việc Mới'}</h2>
              <button onClick={onClose} className="text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-sm">
              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Tên công việc *</label>
                <input
                  type="text"
                  required
                  value={formData.title}
                  onChange={e => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Hạn chót & Pomodoro</label>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="datetime-local"
                    value={formData.deadline}
                    onChange={e => setFormData({ ...formData, deadline: e.target.value })}
                    className="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs"
                  />
                  <input
                    type="number"
                    min="1"
                    value={formData.estimatedPomos}
                    onChange={e => setFormData({ ...formData, estimatedPomos: e.target.value })}
                    className="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs"
                  />
                </div>
              </div>

              {!taskToEdit && formData.deadline && (
                <label className="flex items-center gap-2 p-2 rounded-xl bg-indigo-500/10 text-xs font-bold text-indigo-400 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={formData.syncToCalendar}
                    onChange={e => setFormData({ ...formData, syncToCalendar: e.target.checked })}
                  />
                  <span>Tự động đưa vào Lịch Trình (Calendar)</span>
                </label>
              )}

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 text-xs">Hủy</button>
                <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Lưu</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- SETTINGS MODAL STANDALONE ---
    function SettingsModalStandalone({ isOpen, onClose, settings, currentUser, isAccountLoggedIn, onLogoutAccount, onSave, onExport, onImport, onReset }) {
      const [formData, setFormData] = useState({ ...settings });
      const fileRef = useRef(null);

      const handleFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            onImport(parsed);
          } catch(err) {
            alert('File JSON không hợp lệ!');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-card w-full max-w-lg rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-slate-800 space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
              <h2 className="text-lg font-bold flex items-center gap-2">
                <span>⚙️</span> Cài Đặt Hệ Thống
              </h2>
              <button onClick={onClose} className="text-slate-400">✕</button>
            </div>

            {/* Account Status Card */}
            <div className="p-3.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                  <span>🛡️</span> Tài Khoản & Bảo Mật
                </span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  isAccountLoggedIn ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-500 border border-amber-500/20'
                }`}>
                  {isAccountLoggedIn ? 'Đã đăng nhập' : 'Chưa đăng nhập'}
                </span>
              </div>
              {isAccountLoggedIn ? (
                <div className="flex items-center justify-between pt-1">
                  <div>
                    <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser?.name || 'Người dùng'}</p>
                    <p className="text-[11px] text-slate-500 font-mono">{currentUser?.email}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      if (onLogoutAccount) onLogoutAccount();
                      onClose();
                    }}
                    className="px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-500 text-xs font-bold hover:bg-rose-500/20 transition"
                  >
                    Đăng xuất
                  </button>
                </div>
              ) : (
                <p className="text-xs text-slate-500">
                  Đăng nhập Gmail có mật khẩu riêng để bảo vệ và lưu các chỉnh sửa lịch trình của bạn.
                </p>
              )}
            </div>

            <div className="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label className="text-slate-400">Thời gian Focus (phút)</label>
                <input
                  type="number"
                  value={formData.focusDuration}
                  onChange={e => setFormData({ ...formData, focusDuration: Number(e.target.value) })}
                  className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs font-semibold"
                />
              </div>
              <div>
                <label className="text-slate-400">Mục tiêu phiên ngày</label>
                <input
                  type="number"
                  value={formData.dailyGoalPomos}
                  onChange={e => setFormData({ ...formData, dailyGoalPomos: Number(e.target.value) })}
                  className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs font-semibold"
                />
              </div>
            </div>

            <div className="flex flex-wrap gap-2 pt-2">
              <button type="button" onClick={onExport} className="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">📥 Xuất JSON</button>
              <button type="button" onClick={() => fileRef.current?.click()} className="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">📤 Nhập JSON</button>
              <input ref={fileRef} type="file" accept=".json" onChange={handleFile} className="hidden" />
              <button type="button" onClick={() => { if(confirm('Đặt lại mặc định?')) onReset(); }} className="px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-500 text-xs font-bold ml-auto">Đặt lại</button>
            </div>

            <div className="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
              <button type="button" onClick={onClose} className="px-4 py-2 text-xs">Hủy</button>
              <button type="button" onClick={() => onSave(formData)} className="px-5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Lưu Cài Đặt</button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
