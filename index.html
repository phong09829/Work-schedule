    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- Web Audio API Synthesizer ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      getAudioContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }
      playFocusCompleteSound(volume = 0.8) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0, now + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.3 * volume, now + idx * 0.12 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 2.0);
        });
      }
      playBreakCompleteSound(volume = 0.8) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const notes = [440, 554.37, 659.25];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.15);
          gain.gain.setValueAtTime(0, now + idx * 0.15);
          gain.gain.linearRampToValueAtTime(0.25 * volume, now + idx * 0.15 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.15 + 1.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.15);
          osc.stop(now + idx * 0.15 + 1.7);
        });
      }
      playTaskSuccessSound(volume = 0.8) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const notes = [587.33, 880, 1174.66];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.25 * volume, now + idx * 0.08 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.9);
        });
      }
      playTapSound(volume = 0.5) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.15 * volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    }
    const soundManager = new SoundEffects();

    // --- Storage Keys & Initial Data ---
    const STORAGE_KEYS = {
      USERS: 'focusflow_registered_users_v2',
      CURRENT_USER: 'focusflow_current_user_v2',
      TASKS: 'focusflow_tasks_v1',
      EVENTS: 'focusflow_calendar_events_v1',

      SETTINGS: 'focusflow_settings_v1',

      GOOGLE_CLIENT_ID: 'focusflow_google_client_id_v1',

      GOOGLE_TOKEN: 'focusflow_google_auth_token_v1',
    };

    const GOOGLE_SCOPES = [

    ].join(' ');

    const EVENT_CATEGORIES = [

      { id: 'Cá nhân', label: 'Cá nhân', color: '#10b981' },
      { id: 'Cuộc họp', label: 'Cuộc họp', color: '#f59e0b' },

    const DEFAULT_TASKS = [

    const DEFAULT_EVENTS = [
      {
        id: 'evt-1',
        title: 'Họp Kế Hoạch Tuần & Phân Chia Nhiệm Vụ',
        description: 'Báo cáo tiến độ đồ án và thống nhất các mốc deadline.',
        start: new Date(new Date().setHours(9, 0, 0, 0)).toISOString(),
        end: new Date(new Date().setHours(10, 30, 0, 0)).toISOString(),
        allDay: false,
        category: 'Công việc',
        color: '#3b82f6',
        location: 'Google Meet',
        meetUrl: 'https://meet.google.com/abc-defg-hij',
        isGoogleEvent: false,
      },
      {
        id: 'evt-2',
        title: 'Phiên Deep Work: Lập trình Google Calendar Sync',
        description: 'Code tính năng đồng bộ 2 chiều và giao diện Google Schedule.',
        start: new Date(new Date().setHours(14, 0, 0, 0)).toISOString(),
        end: new Date(new Date().setHours(16, 0, 0, 0)).toISOString(),
        allDay: false,
        category: 'Học tập',
        color: '#8b5cf6',
        location: 'Bàn làm việc',
        isGoogleEvent: false,
      },
      {
        id: 'evt-3',
        title: 'Tập Gym & Thể thao chiều',
        description: 'Chạy bộ 5km và rèn luyện thể lực.',
        start: new Date(new Date().setHours(17, 30, 0, 0)).toISOString(),
        end: new Date(new Date().setHours(18, 30, 0, 0)).toISOString(),
        allDay: false,
        category: 'Cá nhân',
        color: '#10b981',
        location: 'Phòng tập Gym',
        isGoogleEvent: false,
      }
    ];

    const DEFAULT_SETTINGS = {
      focusDuration: 25,
      shortBreakDuration: 5,
      longBreakDuration: 15,
      longBreakInterval: 4,
      dailyGoalPomos: 8,
      dailyGoalHours: 4,
      autoStartBreaks: true,
      autoStartPomos: false,
      soundEnabled: true,
      soundVolume: 0.8,
    };

    const generateInitialPomoSessions = () => {
      const sessions = [];
      const now = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(now.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const count = i === 0 ? 3 : Math.floor(Math.random() * 4) + 3;
        for (let j = 0; j < count; j++) {
          sessions.push({
            id: `pomo-${dateStr}-${j}`,
            date: dateStr,
            durationMinutes: 25,
            type: 'focus',
            taskId: j % 2 === 0 ? 'task-1' : 'task-2',
            taskTitle: j % 2 === 0 ? 'Hoàn thiện đồ án Web Quản Lý Thời Gian' : 'Nghiên cứu kiến trúc TailwindCSS',
            category: j % 2 === 0 ? 'Học tập' : 'Công việc',
            completedAt: new Date(d.getTime() + j * 45 * 60 * 1000).toISOString(),
          });
        }
      }
      return sessions;
    };

    const getStored = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const setStored = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    };

    // --- Multi-Account & Isolated User Data Storage ---
    const normalizeEmail = (email) => {
      if (!email || typeof email !== 'string') return '';
      return email.trim().toLowerCase();
    };

    const getUserStorageKey = (email, dataType) => {
      const cleanEmail = normalizeEmail(email) || 'guest';
      const safeEmail = cleanEmail.replace(/[^a-z0-9@._-]/g, '_');
      return `focusflow_u_${safeEmail}_${dataType}_v2`;
    };

    const getRegisteredUsers = () => {
      return getStored(STORAGE_KEYS.USERS, []);
    };

    const saveRegisteredUsers = (users) => {
      setStored(STORAGE_KEYS.USERS, users);
    };

    const findUserByEmail = (email) => {
      const clean = normalizeEmail(email);
      if (!clean) return null;
      const users = getRegisteredUsers();
      return users.find(u => normalizeEmail(u.email) === clean) || null;
    };

    const getCurrentUser = () => {
      return getStored(STORAGE_KEYS.CURRENT_USER, null);
    };

    const setCurrentUser = (user) => {
      if (!user) {
        localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
      } else {
        setStored(STORAGE_KEYS.CURRENT_USER, user);
      }
    };

    const registerUserAccount = ({ email, password, name }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail || !cleanEmail.includes('@')) {
        return { ok: false, message: 'Địa chỉ Gmail không hợp lệ!' };
      }
      if (!password || password.trim().length < 4) {
        return { ok: false, message: 'Mật khẩu phải có ít nhất 4 ký tự!' };
      }
      const existing = findUserByEmail(cleanEmail);
      if (existing) {
        return { ok: false, errorType: 'EMAIL_EXISTS', message: `Tài khoản Gmail "${cleanEmail}" đã được đăng ký! Vui lòng chọn tab Đăng Nhập.` };
      }
      const displayName = name && name.trim() ? name.trim() : cleanEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      const newUser = {
        id: `usr-${Date.now()}`,
        email: cleanEmail,
        name: displayName,
        password: password.trim(),
        createdAt: new Date().toISOString(),
        lastLogin: new Date().toISOString(),
      };
      const users = getRegisteredUsers();
      users.push(newUser);
      saveRegisteredUsers(users);
      const sessionUser = { id: newUser.id, email: newUser.email, name: newUser.name, createdAt: newUser.createdAt };
      setCurrentUser(sessionUser);
      return { ok: true, user: sessionUser };
    };

    const loginUserAccount = ({ email, password }) => {
      const cleanEmail = normalizeEmail(email);
      if (!cleanEmail) return { ok: false, message: 'Vui lòng nhập địa chỉ Gmail!' };
      const user = findUserByEmail(cleanEmail);
      if (!user) {
        return { ok: false, errorType: 'USER_NOT_FOUND', message: `Tài khoản "${cleanEmail}" chưa tồn tại. Vui lòng chọn tab "Đăng Ký Tài Khoản" để tạo mật khẩu!` };
      }
      if (user.password !== password?.trim()) {
        return { ok: false, errorType: 'WRONG_PASSWORD', message: 'Mật khẩu không chính xác! Vui lòng thử lại.' };
      }
      const users = getRegisteredUsers().map(u => normalizeEmail(u.email) === cleanEmail ? { ...u, lastLogin: new Date().toISOString() } : u);
      saveRegisteredUsers(users);
      const sessionUser = { id: user.id, email: user.email, name: user.name, createdAt: user.createdAt };
      setCurrentUser(sessionUser);
      return { ok: true, user: sessionUser };
    };

    const changeUserPassword = ({ email, oldPassword, newPassword }) => {
      const cleanEmail = normalizeEmail(email);
      const user = findUserByEmail(cleanEmail);
      if (!user) return { ok: false, message: 'Không tìm thấy tài khoản!' };
      if (user.password !== oldPassword?.trim()) return { ok: false, message: 'Mật khẩu hiện tại không chính xác!' };
      if (!newPassword || newPassword.trim().length < 4) return { ok: false, message: 'Mật khẩu mới phải có ít nhất 4 ký tự!' };
      const users = getRegisteredUsers().map(u => normalizeEmail(u.email) === cleanEmail ? { ...u, password: newPassword.trim() } : u);
      saveRegisteredUsers(users);
      return { ok: true, message: 'Đổi mật khẩu thành công!' };
    };

    const getUserData = (email, dataType, fallback) => {
      const key = getUserStorageKey(email, dataType);
      return getStored(key, fallback);
    };

    const setUserData = (email, dataType, value) => {
      const key = getUserStorageKey(email, dataType);
      setStored(key, value);
    };

    const formatForDateTimeInput = (date) => {
      if (!date) return '';
      const d = typeof date === 'string' ? new Date(date) : date;
      if (isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    // --- Google Calendar API Helpers ---
    const fetchGoogleUserProfile = async (accessToken) => {
      const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) throw new Error('User info failed');
      return await res.json();
    };

    const fetchGoogleCalendarEventsAPI = async (accessToken) => {
      const minDate = new Date(Date.now() - 30 * 86400000).toISOString();
      const maxDate = new Date(Date.now() + 90 * 86400000).toISOString();
      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(minDate)}&timeMax=${encodeURIComponent(maxDate)}&singleEvents=true&orderBy=startTime&maxResults=250`;
      
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) {
        if (res.status === 401) throw new Error('TOKEN_EXPIRED');
        throw new Error('Google Calendar fetch failed');
      }
      const data = await res.json();
      return (data.items || []).map(item => {
        const isAllDay = Boolean(item.start?.date && !item.start?.dateTime);
        const start = isAllDay ? item.start.date : item.start.dateTime || item.start.date;
        const end = isAllDay ? item.end.date : item.end.dateTime || item.end.date;
        let meetUrl = item.hangoutLink || '';

        return {
          id: `gcal-${item.id}`,
          googleEventId: item.id,
          title: item.summary || '(Không có tiêu đề)',
          description: item.description || '',
          start: start,
          end: end,
          allDay: isAllDay,
          category: 'Công việc',
          color: '#3b82f6',
          location: item.location || '',
          meetUrl: meetUrl,
          isGoogleEvent: true,
          synced: true,
        };
      });
    };

    const createGoogleCalendarEventAPI = async (accessToken, event) => {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh';
      const body = {
        summary: event.title,
        description: event.description || '',
        location: event.location || '',
      };
      if (event.allDay) {
        body.start = { date: event.start.slice(0, 10) };
        body.end = { date: (event.end || event.start).slice(0, 10) };
      } else {
        body.start = { dateTime: new Date(event.start).toISOString(), timeZone };
        body.end = { dateTime: new Date(event.end || event.start).toISOString(), timeZone };
      }
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Failed to create on Google');
      return await res.json();
    };

    const updateGoogleCalendarEventAPI = async (accessToken, googleEventId, event) => {
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh';
      const body = {
        summary: event.title,
        description: event.description || '',
        location: event.location || '',
      };
      if (event.allDay) {
        body.start = { date: event.start.slice(0, 10) };
        body.end = { date: (event.end || event.start).slice(0, 10) };
      } else {
        body.start = { dateTime: new Date(event.start).toISOString(), timeZone };
        body.end = { dateTime: new Date(event.end || event.start).toISOString(), timeZone };
      }
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(googleEventId)}`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Failed to update on Google');
      return await res.json();
    };

    const deleteGoogleCalendarEventAPI = async (accessToken, googleEventId) => {
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(googleEventId)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      return res.ok;
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isDark, setIsDark] = useState(() => getStored(STORAGE_KEYS.THEME, 'dark') === 'dark');
      
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) root.classList.add('dark');
        else root.classList.remove('dark');
        setStored(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      }, [isDark]);

      const [activeTab, setActiveTab] = useState('dashboard');

      const [currentUser, setCurrentUserState] = useState(() => getCurrentUser());

      const [tasks, setTasks] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'tasks', DEFAULT_TASKS);
        return getStored(STORAGE_KEYS.TASKS, DEFAULT_TASKS);
      });
      const [events, setEvents] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'events', DEFAULT_EVENTS);
        return getStored(STORAGE_KEYS.EVENTS, DEFAULT_EVENTS);
      });
      const [pomoSessions, setPomoSessions] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'pomo', generateInitialPomoSessions());
        return getStored(STORAGE_KEYS.POMO_SESSIONS, generateInitialPomoSessions());
      });
      const [settings, setSettings] = useState(() => {
        const user = getCurrentUser();
        if (user && user.email) return getUserData(user.email, 'settings', DEFAULT_SETTINGS);
        return getStored(STORAGE_KEYS.SETTINGS, DEFAULT_SETTINGS);
      });
      const [activeTaskId, setActiveTaskId] = useState(() => tasks.find(t => t.status === 'in_progress')?.id || tasks[0]?.id || null);
      
      const [googleClientId, setGoogleClientId] = useState(() => getStored(STORAGE_KEYS.GOOGLE_CLIENT_ID, ''));
      const [googleUser, setGoogleUser] = useState(() => getStored(STORAGE_KEYS.GOOGLE_USER, null));
      const [googleToken, setGoogleToken] = useState(() => getStored(STORAGE_KEYS.GOOGLE_TOKEN, null));
      const [isGoogleSyncing, setIsGoogleSyncing] = useState(false);

      const isGoogleConnected = Boolean(googleUser);
      const isAccountLoggedIn = Boolean(currentUser && currentUser.email);

      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(current => current && current.id <= Date.now() - 3000 ? null : current), 3000);
      };

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [taskToEdit, setTaskToEdit] = useState(null);
      const [defaultStatusForNew, setDefaultStatusForNew] = useState('todo');
      const [isGoogleModalOpen, setIsGoogleModalOpen] = useState(false);

      // Persistence
      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'tasks', tasks);
        setStored(STORAGE_KEYS.TASKS, tasks);
      }, [tasks, currentUser]);

      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'events', events);
        setStored(STORAGE_KEYS.EVENTS, events);
      }, [events, currentUser]);

      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'pomo', pomoSessions);
        setStored(STORAGE_KEYS.POMO_SESSIONS, pomoSessions);
      }, [pomoSessions, currentUser]);

      useEffect(() => {
        if (currentUser?.email) setUserData(currentUser.email, 'settings', settings);
        setStored(STORAGE_KEYS.SETTINGS, settings);
      }, [settings, currentUser]);

      useEffect(() => setStored(STORAGE_KEYS.GOOGLE_CLIENT_ID, googleClientId), [googleClientId]);
      useEffect(() => setStored(STORAGE_KEYS.GOOGLE_USER, googleUser), [googleUser]);
      useEffect(() => setStored(STORAGE_KEYS.GOOGLE_TOKEN, googleToken), [googleToken]);

      const activeTask = useMemo(() => tasks.find(t => t.id === activeTaskId) || null, [tasks, activeTaskId]);

      // Multi-Account Authentication Methods
      const registerAccount = ({ email, password, name }) => {
        const res = registerUserAccount({ email, password, name });
        if (!res.ok) {
          showToast(res.message, 'error');
          return res;
        }
        const newUser = res.user;
        setCurrentUserState(newUser);
        const existingEvents = getUserData(newUser.email, 'events', null);
        if (!existingEvents) {
          setUserData(newUser.email, 'events', events);
          setUserData(newUser.email, 'tasks', tasks);
          setUserData(newUser.email, 'pomo', pomoSessions);
          setUserData(newUser.email, 'settings', settings);
        } else {
          setEvents(existingEvents);
          setTasks(getUserData(newUser.email, 'tasks', DEFAULT_TASKS));
          setPomoSessions(getUserData(newUser.email, 'pomo', generateInitialPomoSessions()));
          setSettings(getUserData(newUser.email, 'settings', DEFAULT_SETTINGS));
        }
        showToast(`Đăng ký thành công! Lịch trình của ${newUser.email} đã được bảo vệ bằng mật khẩu.`, 'success');
        return res;
      };

      const loginAccount = ({ email, password }) => {
        const res = loginUserAccount({ email, password });
        if (!res.ok) {
          showToast(res.message, 'error');
          return res;
        }
        const user = res.user;
        setCurrentUserState(user);
        const userEvents = getUserData(user.email, 'events', DEFAULT_EVENTS);
        const userTasks = getUserData(user.email, 'tasks', DEFAULT_TASKS);
        const userPomo = getUserData(user.email, 'pomo', generateInitialPomoSessions());
        const userSettings = getUserData(user.email, 'settings', DEFAULT_SETTINGS);

        setEvents(userEvents);
        setTasks(userTasks);
        setPomoSessions(userPomo);
        setSettings(userSettings);
        showToast(`Đăng nhập thành công! Đã tải ${userEvents.length} lịch trình của ${user.name || user.email}`, 'success');
        return res;
      };

      const changeAccountPassword = ({ oldPassword, newPassword }) => {
        if (!currentUser?.email) {
          showToast('Vui lòng đăng nhập trước khi đổi mật khẩu!', 'warning');
          return { ok: false };
        }
        const res = changeUserPassword({ email: currentUser.email, oldPassword, newPassword });
        if (res.ok) {
          showToast('Đổi mật khẩu thành công!', 'success');
        } else {
          showToast(res.message, 'error');
        }
        return res;
      };

      const logoutAccount = () => {
        setCurrentUser(null);
        setCurrentUserState(null);
        setGoogleUser(null);
        setGoogleToken(null);
        showToast('Đã đăng xuất tài khoản.', 'info');
      };

      const loginWithDirectGmail = (email, customName = null) => {
        if (!email || !email.includes('@')) {
          showToast('Vui lòng nhập địa chỉ email hợp lệ!', 'warning');
          return false;
        }
        const cleanEmail = normalizeEmail(email);
        const user = findUserByEmail(cleanEmail);
        if (user) {
          showToast(`Tài khoản "${cleanEmail}" đã có mật khẩu. Vui lòng nhập mật khẩu để đăng nhập!`, 'warning');
          return false;
        }
        const res = registerAccount({ email: cleanEmail, password: 'password123', name: customName });
        return res.ok;
      };

      const syncWithGoogleCalendar = async (customToken = null) => {
        const token = customToken || googleToken?.access_token;
        if (!token) {
          setIsGoogleModalOpen(true);
          return;
        }

        if (token.startsWith('direct_token_') || googleToken?.provider === 'direct_gmail') {
          setIsGoogleSyncing(true);
          setTimeout(() => {
            setIsGoogleSyncing(false);
            showToast(`Đã đồng bộ dữ liệu lịch trình cho ${googleUser?.email || 'Gmail'}!`, 'success');
          }, 500);
          return;
        }

        setIsGoogleSyncing(true);
        try {
          const gcalEvents = await fetchGoogleCalendarEventsAPI(token);
          setEvents(prev => {
            const localNonGoogle = prev.filter(e => !e.googleEventId);
            return [...gcalEvents, ...localNonGoogle];
          });
          showToast(`Đã đồng bộ ${gcalEvents.length} sự kiện với Google Calendar!`, 'success');
        } catch (err) {
          console.error(err);
          if (err.message === 'TOKEN_EXPIRED') {
            setGoogleUser(null);
            setGoogleToken(null);
            showToast('Phiên Google đã hết hạn. Vui lòng đăng nhập lại.', 'error');
          } else {
            showToast('Không thể kết nối Google Calendar API.', 'warning');
          }
        } finally {
          setIsGoogleSyncing(false);
        }
      };

      const handleGoogleLoginSuccess = async (response) => {
        try {
          const accessToken = response.access_token;
          setGoogleToken({ access_token: accessToken, expires_at: Date.now() + 3600000, provider: 'google_oauth' });
          const profile = await fetchGoogleUserProfile(accessToken);
          setGoogleUser(profile);
          showToast(`Chào mừng ${profile.name}! Đã kết nối Google Calendar.`, 'success');
          syncWithGoogleCalendar(accessToken);
        } catch (e) {
          showToast('Đăng nhập Google thất bại.', 'error');
        }
      };

      const handleGoogleLogout = () => {
        setGoogleUser(null);
        setGoogleToken(null);
        showToast('Đã đăng xuất tài khoản Gmail.', 'info');
      };

      const addEvent = async (eventData) => {
        const newEvent = {
          id: `evt-${Date.now()}`,
          title: eventData.title.trim(),
          description: eventData.description?.trim() || '',
          start: eventData.start,
          end: eventData.end || eventData.start,
          allDay: Boolean(eventData.allDay),
          category: eventData.category || 'Công việc',
          color: eventData.color || '#3b82f6',
          location: eventData.location?.trim() || '',
          meetUrl: eventData.meetUrl?.trim() || '',
          isGoogleEvent: false,
          googleEventId: null,
          synced: true,
          userEmail: currentUser?.email || 'guest',
        };

        setEvents(prev => {
          const updated = [newEvent, ...prev];
          if (currentUser?.email) setUserData(currentUser.email, 'events', updated);
          return updated;
        });
        showToast(`Đã thêm lịch: "${newEvent.title}"`, 'success');

        if (isGoogleConnected && googleToken?.access_token && !googleToken.access_token.startsWith('direct_token_')) {
          try {
            setIsGoogleSyncing(true);
            const created = await createGoogleCalendarEventAPI(googleToken.access_token, newEvent);
            if (created?.id) {
              setEvents(prev => {
                const updated = prev.map(e => e.id === newEvent.id ? { ...e, googleEventId: created.id, isGoogleEvent: true } : e);
                if (currentUser?.email) setUserData(currentUser.email, 'events', updated);
                return updated;
              });
              showToast('Đã đồng bộ ngay lên Google Calendar!', 'success');
            }
          } catch(e) {
            console.error(e);
          } finally {
            setIsGoogleSyncing(false);
          }
        }
      };

      const updateEvent = async (id, fields) => {
        let updatedItem = null;
        setEvents(prev => {
          const updated = prev.map(e => {
            if (e.id === id) {
              updatedItem = { ...e, ...fields };
              return updatedItem;
            }
            return e;
          });
          if (currentUser?.email) setUserData(currentUser.email, 'events', updated);
          return updated;
        });
        showToast('Đã lưu chỉnh sửa lịch trình!', 'info');

        if (updatedItem?.googleEventId && isGoogleConnected && googleToken?.access_token && !googleToken.access_token.startsWith('direct_token_')) {
          try {
            setIsGoogleSyncing(true);
            await updateGoogleCalendarEventAPI(googleToken.access_token, updatedItem.googleEventId, updatedItem);
            showToast('Đã đồng bộ cập nhật lên Google Calendar!', 'success');
          } catch(e) {
            console.error(e);
          } finally {
            setIsGoogleSyncing(false);
          }
        }
      };

      const deleteEvent = async (id) => {
        const target = events.find(e => e.id === id);
        setEvents(prev => {
          const updated = prev.filter(e => e.id !== id);
          if (currentUser?.email) setUserData(currentUser.email, 'events', updated);
          return updated;
        });
        showToast(`Đã xóa sự kiện "${target?.title || ''}"`, 'warning');

        if (target?.googleEventId && isGoogleConnected && googleToken?.access_token && !googleToken.access_token.startsWith('direct_token_')) {
          try {
            setIsGoogleSyncing(true);
            await deleteGoogleCalendarEventAPI(googleToken.access_token, target.googleEventId);
            showToast('Đã xóa trên Google Calendar!', 'success');
          } catch(e) {
            console.error(e);
          } finally {
            setIsGoogleSyncing(false);
          }
        }
      };

      const linkEventToPomodoro = (event) => {
        let existingTask = tasks.find(t => t.title === event.title);
        if (!existingTask) {
          const newTask = {
            id: `task-${Date.now()}`,
            title: event.title,
            description: event.description || event.location || 'Sự kiện Lịch trình',
            category: event.category || 'Công việc',
            priority: 'medium',
            status: 'in_progress',
            deadline: event.start,
            estimatedPomos: 2,
            completedPomos: 0,
            createdAt: new Date().toISOString(),
          };
          setTasks(prev => [newTask, ...prev]);
          setActiveTaskId(newTask.id);
        } else {
          setActiveTaskId(existingTask.id);
        }
        setActiveTab('pomodoro');
        showToast(`Đã chọn "${event.title}" cho phiên Pomodoro`, 'info');
      };

      const addTask = (taskData) => {
        const newTask = {
          id: `task-${Date.now()}`,
          title: taskData.title.trim(),
          description: taskData.description?.trim() || '',
          category: taskData.category || 'Công việc',
          priority: taskData.priority || 'medium',
          status: taskData.status || 'todo',
          deadline: taskData.deadline || '',
          estimatedPomos: Number(taskData.estimatedPomos) || 1,
          completedPomos: 0,
          createdAt: new Date().toISOString(),
          completedAt: null,
        };
        setTasks(prev => [newTask, ...prev]);
        showToast(`Đã thêm công việc: "${newTask.title}"`, 'success');

        if (taskData.syncToCalendar && taskData.deadline) {
          addEvent({
            title: `[Việc] ${newTask.title}`,
            description: newTask.description || '',
            start: new Date(taskData.deadline).toISOString(),
            end: new Date(new Date(taskData.deadline).getTime() + 3600000).toISOString(),
            allDay: false,
            category: newTask.category,
            color: newTask.priority === 'high' ? '#ef4444' : '#3b82f6',
          });
        }
      };

      const updateTask = (id, fields) => {
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            const isNowDone = fields.status === 'done' && t.status !== 'done';
            return {
              ...t,
              ...fields,
              completedAt: isNowDone ? new Date().toISOString() : (fields.status && fields.status !== 'done' ? null : t.completedAt)
            };
          }
          return t;
        }));
        showToast('Đã cập nhật công việc!', 'info');
      };

      const deleteTask = (id) => {
        const t = tasks.find(item => item.id === id);
        setTasks(prev => prev.filter(item => item.id !== id));
        if (activeTaskId === id) setActiveTaskId(null);
        showToast(`Đã xóa "${t?.title || ''}"`, 'warning');
      };

      const moveTaskStatus = (id, newStatus) => {
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            const isDone = newStatus === 'done' && t.status !== 'done';
            if (isDone) {
              try {
                if (window.confetti) {
                  window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
                }
                if (settings.soundEnabled) soundManager.playTaskSuccessSound(settings.soundVolume);
              } catch(e){}
            }
            return {
              ...t,
              status: newStatus,
              completedAt: newStatus === 'done' ? new Date().toISOString() : null,
            };
          }
          return t;
        }));
      };

      const linkTaskToPomodoro = (task) => {
        setActiveTaskId(task.id);
        setActiveTab('pomodoro');
        showToast(`Đã chọn "${task.title}" cho Pomodoro`, 'info');
      };

      const recordCompletedPomodoro = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const durationMins = settings.focusDuration || 25;

        if (activeTaskId) {
          setTasks(prev => prev.map(t => {
            if (t.id === activeTaskId) {
              return {
                ...t,
                completedPomos: (t.completedPomos || 0) + 1,
                status: t.status === 'todo' ? 'in_progress' : t.status
              };
            }
            return t;
          }));
        }

        const newSession = {
          id: `pomo-${Date.now()}`,
          date: todayStr,
          durationMinutes: durationMins,
          type: 'focus',
          taskId: activeTaskId || null,
          taskTitle: activeTask?.title || 'Tập trung tự do',
          category: activeTask?.category || 'Chung',
          completedAt: new Date().toISOString(),
        };

        setPomoSessions(prev => [newSession, ...prev]);
        showToast(`Tuyệt vời! Hoàn thành 1 phiên Focus (${durationMins}p)`, 'success');
        try {
          if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } catch(e){}
      };

      // Analytics
      const todayStr = new Date().toISOString().split('T')[0];
      const todaySessions = useMemo(() => pomoSessions.filter(s => s.date === todayStr && s.type === 'focus'), [pomoSessions, todayStr]);
      const todayFocusMinutes = useMemo(() => todaySessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0), [todaySessions]);
      const todayCompletedTasks = useMemo(() => tasks.filter(t => t.status === 'done' && t.completedAt && t.completedAt.startsWith(todayStr)).length, [tasks, todayStr]);
      const totalCompletedTasks = useMemo(() => tasks.filter(t => t.status === 'done').length, [tasks]);
      
      const streakDays = useMemo(() => {
        let streak = 0;
        const now = new Date();
        for (let i = 0; i < 30; i++) {
          const d = new Date();
          d.setDate(now.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const hasFocus = pomoSessions.some(s => s.date === dateStr && s.type === 'focus');
          if (hasFocus) streak++;
          else if (i > 0) break;
        }
        return Math.max(streak, 1);
      }, [pomoSessions]);

      return (
        <div className="min-h-screen relative flex flex-col transition-colors duration-300">
          <div className="ambient-glow top-0 left-1/4 w-96 h-96 bg-indigo-500" />
          <div className="ambient-glow top-1/3 right-10 w-80 h-80 bg-purple-500" />
          <div className="ambient-glow bottom-10 left-10 w-80 h-80 bg-emerald-500" />

          {/* Sticky Navbar */}
          <header className="sticky top-0 z-40 w-full glass-nav">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div onClick={() => setActiveTab('dashboard')} className="flex items-center gap-3 cursor-pointer group select-none">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform text-white font-bold text-lg">
                    ⏱️
                  </div>
                  <div>
                    <span className="text-lg font-extrabold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
                      FocusFlow
                    </span>
                    <span className="hidden sm:inline-block ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500 border border-indigo-500/20">
                      PRO
                    </span>
                  </div>
                </div>

                <nav className="hidden md:flex items-center gap-1 bg-slate-200/60 dark:bg-slate-900/60 p-1.5 rounded-2xl border border-slate-300/50 dark:border-slate-800/80 backdrop-blur-md">
                  {[
                    { id: 'dashboard', label: 'Bảng Điều Khiển', icon: '📊' },
                    { id: 'tasks', label: 'Công Việc & Kanban', icon: '📋' },
                    { id: 'calendar', label: 'Lịch Trình & Google', icon: '📅' },
                    { id: 'pomodoro', label: 'Đồng Hồ Pomodoro', icon: '⏱️' },
                  ].map((item) => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`flex items-center gap-2 px-3.5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 ${
                          isActive
                            ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-md'
                            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-white/40 dark:hover:bg-slate-800/40'
                        }`}
                      >
                        <span>{item.icon}</span>
                        <span>{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                <div className="flex items-center gap-2 sm:gap-2.5">
                  <button
                    onClick={() => setIsGoogleModalOpen(true)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                      isAccountLoggedIn
                        ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-300'
                        : 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white border-transparent hover:from-indigo-500 hover:to-purple-500 shadow-md'
                    }`}
                  >
                    {isAccountLoggedIn ? (
                      <>
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                        <span className="hidden sm:inline">
                          {currentUser?.name?.split(' ')[0] || currentUser?.email?.split('@')[0]}
                        </span>
                      </>
                    ) : (
                      <>
                        <span>🔒</span>
                        <span>Đăng Nhập Gmail</span>
                      </>
                    )}
                  </button>

                  <div title={`Chuỗi ${streakDays} ngày liên tục`} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-xs font-bold select-none">
                    <span>🔥</span>
                    <span>{streakDays}d</span>
                  </div>

                  <button
                    onClick={() => setIsDark(!isDark)}
                    title={isDark ? 'Giao diện Sáng' : 'Giao diện Tối'}
                    className="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/80 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition"
                  >
                    {isDark ? '☀️' : '🌙'}
                  </button>

                  <button
                    onClick={() => setIsSettingsOpen(true)}
                    title="Cài đặt"
                    className="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/80 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition"
                  >
                    ⚙️
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-24 md:pb-12 relative z-10">
            {activeTab === 'dashboard' && (
              <DashboardViewStandalone
                todayFocusMinutes={todayFocusMinutes}
                todayCompletedTasks={todayCompletedTasks}
                totalCompletedTasks={totalCompletedTasks}
                todayPomoCount={todaySessions.length}
                streakDays={streakDays}
                tasks={tasks}
                events={events}
                pomoSessions={pomoSessions}
                settings={settings}
                setActiveTab={setActiveTab}
                linkTaskToPomodoro={linkTaskToPomodoro}
                moveTaskStatus={moveTaskStatus}
                isDark={isDark}
              />
            )}

            {activeTab === 'tasks' && (
              <TaskViewStandalone
                tasks={tasks}
                onEditTask={(t) => { setTaskToEdit(t); setIsTaskModalOpen(true); }}
                onAddNew={(status = 'todo') => { setTaskToEdit(null); setDefaultStatusForNew(status); setIsTaskModalOpen(true); }}
                moveTaskStatus={moveTaskStatus}
                deleteTask={deleteTask}
                linkTaskToPomodoro={linkTaskToPomodoro}
                activeTaskId={activeTaskId}
              />
            )}

            {activeTab === 'calendar' && (
              <CalendarViewStandalone
                events={events}
                currentUser={currentUser}
                isAccountLoggedIn={isAccountLoggedIn}
                onAddEvent={addEvent}
                onUpdateEvent={updateEvent}
                onDeleteEvent={deleteEvent}
                onLinkPomodoro={linkEventToPomodoro}
                isGoogleConnected={isGoogleConnected}
                isGoogleSyncing={isGoogleSyncing}
                onSyncGoogle={syncWithGoogleCalendar}
                onOpenGoogleConfig={() => setIsGoogleModalOpen(true)}
              />
            )}

            {activeTab === 'pomodoro' && (
              <PomodoroViewStandalone
                settings={settings}
                activeTask={activeTask}
                activeTaskId={activeTaskId}
                setActiveTaskId={setActiveTaskId}
                tasks={tasks}
                recordCompletedPomodoro={recordCompletedPomodoro}
                pomoSessions={pomoSessions}
                todayFocusMinutes={todayFocusMinutes}
                todayPomoCount={todaySessions.length}
                showToast={showToast}
              />
            )}
          </main>

          {/* Mobile Bottom Bar */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 px-3 py-2 flex justify-around items-center">
            {[
              { id: 'dashboard', label: 'Tổng quan', icon: '📊' },
              { id: 'tasks', label: 'Công việc', icon: '📋' },
              { id: 'calendar', label: 'Lịch trình', icon: '📅' },
              { id: 'pomodoro', label: 'Pomodoro', icon: '⏱️' },
            ].map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition ${
                    isActive ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400 font-medium'
                  }`}
                >
                  <span className="text-lg">{item.icon}</span>
                  <span className="text-[10px]">{item.label}</span>
                </button>
              );
            })}
          </nav>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-20 sm:bottom-6 right-6 z-50 animate-fade-in">
              <div className="flex items-center gap-3 px-4 py-3 rounded-xl border border-indigo-500/30 bg-slate-900/95 text-slate-100 shadow-xl backdrop-blur-md text-sm font-medium">
                <span>{toast.type === 'success' ? '✅' : toast.type === 'warning' ? '⚠️' : 'ℹ️'}</span>
                <p>{toast.message}</p>
              </div>
            </div>
          )}

          {/* Modals */}
          {isTaskModalOpen && (
            <TaskModalStandalone
              isOpen={isTaskModalOpen}
              onClose={() => setIsTaskModalOpen(false)}
              taskToEdit={taskToEdit}
              defaultStatus={defaultStatusForNew}
              onSave={(formData) => {
                if (taskToEdit) updateTask(taskToEdit.id, formData);
                else addTask(formData);
                setIsTaskModalOpen(false);
              }}
            />
          )}

          {isGoogleModalOpen && (
            <GoogleOAuthModalStandalone
              isOpen={isGoogleModalOpen}
              onClose={() => setIsGoogleModalOpen(false)}
              currentUser={currentUser}
              isAccountLoggedIn={isAccountLoggedIn}
              onRegisterAccount={registerAccount}
              onLoginAccount={loginAccount}
              onChangePassword={changeAccountPassword}
              onLogoutAccount={logoutAccount}
              events={events}
              tasks={tasks}
              pomoSessions={pomoSessions}
              clientId={googleClientId}
              onSaveClientId={setGoogleClientId}
              googleUser={googleUser}
              isGoogleConnected={isGoogleConnected}
              onLoginSuccess={handleGoogleLoginSuccess}
              onSync={syncWithGoogleCalendar}
              isSyncing={isGoogleSyncing}
              showToast={showToast}
            />
          )}

          {isSettingsOpen && (
            <SettingsModalStandalone
              isOpen={isSettingsOpen}
              onClose={() => setIsSettingsOpen(false)}
              settings={settings}
              currentUser={currentUser}
              isAccountLoggedIn={isAccountLoggedIn}
              onLogoutAccount={logoutAccount}
              onSave={(newSettings) => {
                setSettings(newSettings);
                setIsSettingsOpen(false);
                showToast('Đã lưu cài đặt hệ thống!', 'success');
              }}
              onExport={() => {
                const backup = { version: '2.0', exportDate: new Date().toISOString(), tasks, events, pomoSessions, settings };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `focusflow-backup-${todayStr}.json`;
                link.click();
                URL.revokeObjectURL(url);
                showToast('Đã xuất dữ liệu sao lưu thành công!', 'success');
              }}
              onImport={(data) => {
                if (data.tasks) setTasks(data.tasks);
                if (data.events) setEvents(data.events);
                if (data.pomoSessions) setPomoSessions(data.pomoSessions);
                if (data.settings) setSettings(data.settings);
                showToast('Đã khôi phục dữ liệu!', 'success');
              }}
              onReset={() => {
                setTasks(DEFAULT_TASKS);
                setEvents(DEFAULT_EVENTS);
                setPomoSessions(generateInitialPomoSessions());
                setSettings(DEFAULT_SETTINGS);
                showToast('Đã đặt lại dữ liệu mặc định!', 'info');
                setIsSettingsOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // --- 1. DASHBOARD VIEW STANDALONE ---
    function DashboardViewStandalone({
      todayFocusMinutes,
      todayCompletedTasks,
      totalCompletedTasks,
      todayPomoCount,
      streakDays,
      tasks,
      events,
      pomoSessions,
      settings,
      setActiveTab,
      linkTaskToPomodoro,
      moveTaskStatus,
      isDark
    }) {
      const hours = (todayFocusMinutes / 60).toFixed(1);
      const targetPomos = settings.dailyGoalPomos || 8;
      const goalProgress = Math.min(100, Math.round((todayPomoCount / targetPomos) * 100));

      const urgentTask = useMemo(() => {
        return (
          tasks.find(t => t.status === 'in_progress' && t.priority === 'high') ||
          tasks.find(t => t.status === 'in_progress') ||
          tasks.find(t => t.status === 'todo' && t.priority === 'high') ||
          tasks.find(t => t.status === 'todo') ||
          null
        );
      }, [tasks]);

      const recentTasks = useMemo(() => tasks.slice(0, 4), [tasks]);

      // Chart.js initialization
      const barCanvasRef = useRef(null);
      const doughnutCanvasRef = useRef(null);

      useEffect(() => {
        let barChart = null;
        let doughnutChart = null;

        if (barCanvasRef.current && window.Chart) {
          const days = [];
          const points = [];
          const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            const dayName = dayNames[d.getDay()];
            const totalMins = pomoSessions
              .filter(s => s.date === dateStr && s.type === 'focus')
              .reduce((sum, s) => sum + (s.durationMinutes || 0), 0);
            days.push(`${dayName} (${d.getDate()}/${d.getMonth() + 1})`);
            points.push(totalMins);
          }

          barChart = new window.Chart(barCanvasRef.current, {
            type: 'bar',
            data: {
              labels: days,
              datasets: [{
                label: 'Phút tập trung',
                data: points,
                backgroundColor: 'rgba(99, 102, 241, 0.85)',
                hoverBackgroundColor: 'rgba(79, 70, 229, 1)',
                borderRadius: 8,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' },
                  ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                },
                x: {
                  grid: { display: false },
                  ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                }
              }
            }
          });
        }

        if (doughnutCanvasRef.current && window.Chart) {
          const catMap = {};
          pomoSessions.forEach(s => {
            const cat = s.category || 'Công việc';
            catMap[cat] = (catMap[cat] || 0) + (s.durationMinutes || 25);
          });
          const labels = Object.keys(catMap).length ? Object.keys(catMap) : ['Công việc', 'Học tập', 'Cá nhân'];
          const dataValues = Object.keys(catMap).length ? Object.values(catMap) : [120, 90, 45];

          doughnutChart = new window.Chart(doughnutCanvasRef.current, {
            type: 'doughnut',
            data: {
              labels: labels,
              datasets: [{
                data: dataValues,
                backgroundColor: ['#6366f1', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'],
                borderWidth: 0,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: isDark ? '#94a3b8' : '#64748b', boxWidth: 12 } }
              },
              cutout: '70%'
            }
          });
        }

        return () => {
          if (barChart) barChart.destroy();
          if (doughnutChart) doughnutChart.destroy();
        };
      }, [pomoSessions, isDark]);

      return (
        <div className="space-y-8 animate-fade-in pb-12">
          {/* Welcome Banner */}
          <div className="relative overflow-hidden rounded-3xl p-6 sm:p-8 bg-gradient-to-r from-indigo-600 via-indigo-600 to-purple-600 text-white shadow-2xl shadow-indigo-500/20">
            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div className="max-w-xl">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 backdrop-blur-md text-xs font-semibold mb-3 border border-white/20">
                  <span>✨</span>
                  <span>Chào mừng bạn đến với FocusFlow</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                  Làm chủ thời gian, tối đa hóa năng suất
                </h1>
                <p className="mt-2 text-sm text-indigo-100/90 leading-relaxed">
                  Bạn đã hoàn thành <strong className="text-white font-bold">{todayPomoCount}</strong> phiên Pomodoro hôm nay. Tiếp tục duy trì chuỗi <strong className="text-amber-300 font-bold">{streakDays} ngày</strong> bứt phá nhé!
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3 shrink-0">
                <button
                  onClick={() => setActiveTab('pomodoro')}
                  className="flex items-center gap-2 px-5 py-3 rounded-2xl bg-white text-indigo-700 font-bold text-sm shadow-lg shadow-black/10 hover:bg-indigo-50 transition-all active:scale-95"
                >
                  <span>⏱️</span>
                  <span>Bật Pomodoro Ngay</span>
                </button>
                <button
                  onClick={() => setActiveTab('calendar')}
                  className="flex items-center gap-2 px-5 py-3 rounded-2xl bg-white/15 hover:bg-white/25 border border-white/20 text-white font-semibold text-sm backdrop-blur-md transition-all"
                >
                  <span>📅</span>
                  <span>Xem Lịch Trình</span>
                </button>
              </div>
            </div>

            <div className="mt-6 pt-5 border-t border-white/15">
              <div className="flex items-center justify-between text-xs font-bold mb-2">
                <span>Tiến độ mục tiêu hôm nay: {todayPomoCount} / {targetPomos} Pomodoro</span>
                <span>{goalProgress}%</span>
              </div>
              <div className="w-full h-2.5 bg-black/20 rounded-full overflow-hidden p-0.5">
                <div className="h-full bg-gradient-to-r from-amber-300 to-emerald-300 rounded-full transition-all duration-500" style={{ width: `${goalProgress}%` }} />
              </div>
            </div>
          </div>

          {/* Metric Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Việc Xong Hôm Nay</span>
                <span className="p-2 rounded-xl bg-emerald-500/10 text-emerald-500 text-lg">✅</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{todayCompletedTasks}</h3>
              <p className="text-xs text-slate-400 mt-1">Tổng hoàn thành: {totalCompletedTasks} việc</p>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Thời Gian Tập Trung</span>
                <span className="p-2 rounded-xl bg-indigo-500/10 text-indigo-500 text-lg">🕒</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{hours}h</h3>
              <p className="text-xs text-slate-400 mt-1">{todayFocusMinutes} phút tập trung sâu</p>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Phiên Pomodoro</span>
                <span className="p-2 rounded-xl bg-purple-500/10 text-purple-500 text-lg">🍅</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{todayPomoCount}</h3>
              <p className="text-xs text-slate-400 mt-1">Mục tiêu: {targetPomos} phiên/ngày</p>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400">Chuỗi Kỷ Lục</span>
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-500 text-lg">🔥</span>
              </div>
              <h3 className="text-2xl font-extrabold mt-2">{streakDays} ngày</h3>
              <p className="text-xs text-amber-500 font-bold mt-1">Đang cháy!</p>
            </div>
          </div>

          {/* Charts */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800">
              <h3 className="font-bold text-base mb-4">Biểu Đồ Năng Suất 7 Ngày Gần Nhất</h3>
              <div className="h-64">
                <canvas ref={barCanvasRef} />
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800">
              <h3 className="font-bold text-base mb-4">Phân Bổ Theo Danh Mục</h3>
              <div className="h-64">
                <canvas ref={doughnutCanvasRef} />
              </div>
            </div>
          </div>

          {/* Urgent Task & Recent List */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-rose-500 flex items-center gap-1.5 mb-2">
                  <span>⚡</span> Công việc cần tập trung
                </span>
                {urgentTask ? (
                  <div className="space-y-2">
                    <h3 className="font-bold text-lg">{urgentTask.title}</h3>
                    <p className="text-xs text-slate-400 line-clamp-2">{urgentTask.description || 'Chưa có mô tả.'}</p>
                    <div className="flex gap-2 text-xs pt-2">
                      <span className="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-500 font-bold">{urgentTask.category}</span>
                      <span className="text-slate-400">🍅 {urgentTask.completedPomos || 0}/{urgentTask.estimatedPomos || 1} Pomos</span>
                    </div>
                  </div>
                ) : (
                  <div className="py-6 text-center text-slate-400">
                    <p>Tuyệt vời! Đã hết việc cần làm.</p>
                  </div>
                )}
              </div>
              {urgentTask && (
                <button
                  onClick={() => linkTaskToPomodoro(urgentTask)}
                  className="mt-4 w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md transition"
                >
                  Bắt đầu phiên cho việc này ⏱️
                </button>
              )}
            </div>

            <div className="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-bold text-base">Danh Sách Công Việc Gần Đây</h3>
                <button onClick={() => setActiveTab('tasks')} className="text-xs text-indigo-500 font-bold hover:underline">Xem tất cả →</button>
              </div>

              <div className="space-y-2.5">
                {recentTasks.map(t => (
                  <div key={t.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-700/60 text-xs">
                    <div className="flex items-center gap-2.5 truncate">
                      <button
                        onClick={() => moveTaskStatus(t.id, t.status === 'done' ? 'todo' : 'done')}
                        className={`w-4 h-4 rounded border flex items-center justify-center ${t.status === 'done' ? 'bg-emerald-500 text-white' : ''}`}
                      >
                        {t.status === 'done' ? '✓' : ''}
                      </button>
                      <span className={`font-semibold truncate ${t.status === 'done' ? 'line-through text-slate-400' : ''}`}>{t.title}</span>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 font-bold text-[10px]">{t.category}</span>
                      <button onClick={() => linkTaskToPomodoro(t)} className="p-1 rounded bg-indigo-500/10 text-indigo-500">▶</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 2. TASK VIEW STANDALONE (Kanban Board) ---
    function TaskViewStandalone({ tasks, onEditTask, onAddNew, moveTaskStatus, deleteTask, linkTaskToPomodoro, activeTaskId }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('all');
      const [viewMode, setViewMode] = useState('kanban'); // 'kanban' | 'list'

      const filtered = useMemo(() => {
        return tasks.filter(t => {
          const matchQ = !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase());
          const matchC = selectedCat === 'all' || t.category === selectedCat;
          return matchQ && matchC;
        });
      }, [tasks, searchQuery, selectedCat]);

      const columns = [
        { id: 'todo', title: 'Cần Làm', color: 'border-indigo-500/40 text-indigo-500' },
        { id: 'in_progress', title: 'Đang Làm', color: 'border-amber-500/40 text-amber-500' },
        { id: 'done', title: 'Hoàn Thành', color: 'border-emerald-500/40 text-emerald-500' },
      ];

      return (
        <div className="space-y-6 animate-fade-in pb-12">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
                <span>📋</span>
                <span>Quản Lý Công Việc</span>
              </h1>
              <p className="text-xs text-slate-400 mt-1">Tổng cộng: {tasks.length} công việc ({tasks.filter(t => t.status === 'done').length} đã xong)</p>
            </div>

            <button
              onClick={() => onAddNew('todo')}
              className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-500/25 active:scale-95 transition"
            >
              <span>➕</span>
              <span>Thêm Công Việc</span>
            </button>
          </div>

          <div className="glass-card rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <input
              type="text"
              placeholder="Tìm kiếm công việc..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs font-medium w-48 sm:w-64"
            />

            <div className="flex items-center gap-2">
              <select
                value={selectedCat}
                onChange={e => setSelectedCat(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border text-xs font-semibold"
              >
                <option value="all">Tất cả phân loại</option>
                <option value="Công việc">Công việc</option>
                <option value="Học tập">Học tập</option>
                <option value="Cá nhân">Cá nhân</option>
              </select>

              <div className="flex p-1 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">

    // --- 3. POMODORO VIEW STANDALONE ---
    function PomodoroViewStandalone({ settings, activeTask, activeTaskId, setActiveTaskId, tasks, recordCompletedPomodoro, pomoSessions, todayFocusMinutes, todayPomoCount, showToast }) {
      const [mode, setMode] = useState('focus');
      const [isRunning, setIsRunning] = useState(false);
      const [cycleCount, setCycleCount] = useState(1);

      const getSeconds = (m) => {
        if (m === 'focus') return (settings.focusDuration || 25) * 60;
        if (m === 'shortBreak') return (settings.shortBreakDuration || 5) * 60;
        if (m === 'longBreak') return (settings.longBreakDuration || 15) * 60;
        return 25 * 60;
      };

      const [timeLeft, setTimeLeft] = useState(() => getSeconds('focus'));
      const [totalDuration, setTotalDuration] = useState(() => getSeconds('focus'));

      useEffect(() => {
        if (!isRunning) {
          const s = getSeconds(mode);
          setTimeLeft(s);
          setTotalDuration(s);
        }
      }, [settings, mode]);

      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (isRunning && timeLeft === 0) {
          setIsRunning(false);
          if (mode === 'focus') {
            if (settings.soundEnabled) soundManager.playFocusCompleteSound(settings.soundVolume);
            recordCompletedPomodoro('focus');
            const isLong = cycleCount >= (settings.longBreakInterval || 4);
            setCycleCount(prev => isLong ? 1 : prev + 1);
            setMode(isLong ? 'longBreak' : 'shortBreak');
            const nextSec = getSeconds(isLong ? 'longBreak' : 'shortBreak');
            setTimeLeft(nextSec);
            setTotalDuration(nextSec);
          } else {
            if (settings.soundEnabled) soundManager.playBreakCompleteSound(settings.soundVolume);
            setMode('focus');
            const nextSec = getSeconds('focus');
            setTimeLeft(nextSec);
            setTotalDuration(nextSec);
          }
        }
        return () => { if (interval) clearInterval(interval); };
      }, [isRunning, timeLeft]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const progress = totalDuration > 0 ? (totalDuration - timeLeft) / totalDuration : 0;
      const strokeDashoffset = 880 - 880 * progress;

      return (
        <div className="space-y-8 animate-fade-in max-w-3xl mx-auto pb-12">
          <div className="text-center space-y-2">
            <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">Đồng Hồ Pomodoro Thông Minh</h1>
            <p className="text-xs sm:text-sm text-slate-400">25 phút tập trung cao độ + 5 phút nghỉ ngơi duy trì trạng thái Deep Work.</p>
          </div>

          <div className="glass-card rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-2xl relative overflow-hidden flex flex-col items-center">
            <div className="flex gap-2 mb-6 bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">
              {[
                { id: 'focus', label: 'Tập Trung 🍅' },
                { id: 'shortBreak', label: 'Nghỉ Ngắn ☕' },
                { id: 'longBreak', label: 'Nghỉ Dài 🛋️' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => { setIsRunning(false); setMode(t.id); const sec = getSeconds(t.id); setTimeLeft(sec); setTotalDuration(sec); }}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                    mode === t.id ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-md' : 'text-slate-400'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* Circular Progress Timer */}
            <div className="relative w-72 h-72 flex items-center justify-center">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="140" stroke="currentColor" strokeWidth="12" fill="transparent" className="text-slate-200 dark:text-slate-800" />
                <circle
                  cx="150"
                  cy="150"
                  r="140"
                  stroke={mode === 'focus' ? '#6366f1' : '#10b981'}
                  strokeWidth="12"
                  strokeDasharray="880"
                  strokeDashoffset={strokeDashoffset}
                  strokeLinecap="round"
                  fill="transparent"
                  className="transition-all duration-1000 ease-linear"
                />
              </svg>

              <div className="absolute flex flex-col items-center justify-center text-center">
                <span className="font-mono text-5xl sm:text-6xl font-extrabold tracking-tight">
                  {formatTime(timeLeft)}
                </span>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400 mt-2">
                  {mode === 'focus' ? 'Phiên Tập Trung' : 'Giờ Nghỉ Ngơi'}
                </span>
                {activeTask && (
                  <span className="text-xs font-semibold text-indigo-500 mt-1 max-w-[180px] truncate">
                    🎯 {activeTask.title}
                  </span>
                )}
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-4 mt-8">
              <button
                onClick={() => { setIsRunning(false); setTimeLeft(getSeconds(mode)); }}
                className="px-4 py-2.5 rounded-2xl bg-slate-200 dark:bg-slate-800 text-xs font-bold hover:bg-slate-300 transition"
              >
                Đặt Lại
              </button>
              <button
                onClick={() => { soundManager.getAudioContext(); soundManager.playTapSound(); setIsRunning(!isRunning); }}
                className="px-8 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base shadow-xl shadow-indigo-500/30 active:scale-95 transition"
              >
                {isRunning ? 'TẠM DỪNG' : 'BẮT ĐẦU'}
              </button>
              <button
                onClick={() => setTimeLeft(0)}
                className="px-4 py-2.5 rounded-2xl bg-slate-200 dark:bg-slate-800 text-xs font-bold hover:bg-slate-300 transition"
              >
                Bỏ Qua
              </button>
            </div>

            <div className="mt-8 pt-4 border-t border-slate-200 dark:border-slate-800 w-full flex items-center justify-between text-xs text-slate-400">
              <span>Chu kỳ: {cycleCount}/{settings.longBreakInterval || 4}</span>
              <span>Hôm nay: {todayPomoCount} phiên ({todayFocusMinutes}p)</span>
            </div>
          </div>
        </div>
      );
    }

    // --- SUB-VIEW: MONTH ---
    function MonthViewCalendar({ currentDate, events, onSelectEvent, onAddNew, onUpdateEvent }) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let startDay = firstDay.getDay() - 1;
      if (startDay === -1) startDay = 6;

      const daysInMonth = lastDay.getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const prevDays = [];
      for (let i = startDay - 1; i >= 0; i--) {
        prevDays.push({ day: prevMonthLastDay - i, month: month - 1, year: month === 0 ? year - 1 : year, current: false });
      }

      const currDays = [];
      for (let i = 1; i <= daysInMonth; i++) {
        currDays.push({ day: i, month, year, current: true });
      }

      const nextDays = [];
      const remaining = 42 - (prevDays.length + currDays.length);
      for (let i = 1; i <= remaining; i++) {
        nextDays.push({ day: i, month: month + 1, year: month === 11 ? year + 1 : year, current: false });
      }

      const allDays = [...prevDays, ...currDays, ...nextDays];
      const today = new Date();
      const pad = n => String(n).padStart(2, '0');

      return (
        <div className="glass-card rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-xl">
          <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-100/50 dark:bg-slate-900/50 text-center text-xs font-bold py-3 text-slate-600 dark:text-slate-400">
            {['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'].map((h, i) => (
              <div key={i} className={i >= 5 ? 'text-indigo-500' : ''}>{h}</div>
            ))}
          </div>

          <div className="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-200/60 dark:divide-slate-800/60">
            {allDays.map((d, index) => {
              const actualMonth = d.month < 0 ? 12 + d.month : d.month % 12;
              const dateStr = `${d.year}-${pad(actualMonth + 1)}-${pad(d.day)}`;
              const dayEvts = events.filter(e => e.start && e.start.slice(0, 10) === dateStr);
              const isToday = d.day === today.getDate() && d.month === today.getMonth() && d.year === today.getFullYear();

              return (
                <div
                  key={index}
                  onClick={(e) => {
                    if (e.target === e.currentTarget || e.target.classList.contains('cell-click')) {
                      onAddNew(new Date(d.year, d.month, d.day));
                    }
                  }}
                  className={`min-h-[110px] p-2 transition-colors relative flex flex-col group cell-click ${
                    d.current ? 'bg-transparent hover:bg-slate-50/60 dark:hover:bg-slate-800/30' : 'bg-slate-100/30 dark:bg-slate-950/40 text-slate-400 dark:text-slate-600'

                >
                  <div className="flex items-center justify-between mb-1 cell-click">
                    <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold select-none ${
                      isToday ? 'bg-indigo-600 text-white shadow-md' : d.current ? 'text-slate-700 dark:text-slate-300' : 'text-slate-400'
                    }`}>
                      {d.day}
                    </span>
                    <button
                      onClick={(e) => { e.stopPropagation(); onAddNew(new Date(d.year, d.month, d.day)); }}
                      className="opacity-0 group-hover:opacity-100 w-5 h-5 rounded bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold"
                    >

                  <div className="flex-1 space-y-1 overflow-y-auto max-h-[75px] pr-0.5">
                    {dayEvts.map(evt => {

                          onClick={(e) => { e.stopPropagation(); onSelectEvent(evt); }}
